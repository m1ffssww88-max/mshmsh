<style>
  :root{
    --bg-deep:#1B1420;
    --bg-panel:#241A2B;
    --bg-panel-2:#2E2136;
    --line:#3D2E45;
    --apricot:#FF9F5B;
    --apricot-deep:#E8763A;
    --apricot-soft:#FFD9A8;
    --cream:#F6ECD9;
    --muted:#B9A9C2;
    --ok:#8FD19E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #2A1E33 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #24202f 0%, transparent 40%),
      var(--bg-deep);
    color:var(--cream);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Lalezar', 'Cairo', sans-serif; letter-spacing:.5px; }

  /* ---------- perforated film strip decoration ---------- */
  .film-edge{
    height:14px;
    background-image: radial-gradient(circle, var(--bg-deep) 3.5px, transparent 3.6px);
    background-size: 18px 14px;
    background-position: 6px center;
    background-color: var(--apricot-deep);
  }

  /* ---------- landing ---------- */
  .landing{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:28px;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
  }
  .logo-img{
    display:block; border-radius:50%;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
  }
  .logo-img-lg{ width:120px; height:120px; }
  .logo-img-sm{ width:36px; height:36px; }
  .logo .fruit{
    width:44px; height:44px; border-radius:50% 50% 50% 4px;
    background:linear-gradient(155deg, var(--apricot-soft), var(--apricot-deep));
    box-shadow: inset -6px -6px 10px rgba(0,0,0,.25);
    position:relative;
  }
  .logo .fruit::after{
    content:"";
    position:absolute; top:-6px; left:50%; transform:translateX(-50%) rotate(20deg);
    width:3px; height:14px; background:#7a9b5c; border-radius:2px;
  }
  .logo h1{ font-size:2.6rem; color:var(--apricot); text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .tagline{ color:var(--muted); font-size:1rem; text-align:center; max-width:360px; }

  .ticket{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:18px;
    width:100%; max-width:380px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .ticket-body{ padding:26px 24px 20px; display:flex; flex-direction:column; gap:14px; }
  .field label{ font-size:.8rem; color:var(--muted); display:block; margin-bottom:6px; }
  .field input{
    width:100%; padding:12px 14px; border-radius:10px;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cream);
    font-family:'Cairo'; font-size:1rem; outline:none;
  }
  .field input:focus{ border-color:var(--apricot); }
  .row{ display:flex; gap:10px; }
  .btn{
    border:none; border-radius:10px; padding:12px 16px;
    font-family:'Cairo'; font-weight:700; font-size:.95rem; cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(155deg, var(--apricot-soft), var(--apricot-deep)); color:#2a1810; flex:1; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--cream); }
  .btn-ghost:hover{ border-color:var(--apricot); }
  .divider-text{ text-align:center; color:var(--muted); font-size:.8rem; position:relative; margin:2px 0; }
  .err{ color:#ff8686; font-size:.82rem; min-height:1em; }

  /* ---------- room ---------- */
  .room{ min-height:100vh; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--bg-panel); border-bottom:1px solid var(--line);
    gap:14px; flex-wrap:wrap;
  }
  .topbar .logo h1{ font-size:1.5rem; }
  .code-stub{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-panel-2); border:1px dashed var(--apricot); border-radius:10px;
    padding:6px 12px; font-family:'Lalezar'; letter-spacing:2px; color:var(--apricot-soft);
    cursor:pointer; font-size:1.1rem;
  }
  .code-stub small{ font-family:'Cairo'; color:var(--muted); font-size:.7rem; letter-spacing:0; }
  .who{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:6px;
  }
  .chip.me{ color:var(--apricot-soft); border-color:var(--apricot); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }

  .stage{
    flex:1; display:grid; grid-template-columns:1fr 360px; gap:0; min-height:0;
    width:100%; max-width:1500px; margin:0 auto;
  }

  /* ---- تابلت: نفس التقسيم جنب بعض بس عمود دردشة أضيق ---- */
  @media (max-width:1099px) and (min-width:701px){
    .stage{ grid-template-columns:1fr 300px; }
    .player-zone{ padding:16px; }
  }

  /* ---- جوال: كل شي فوق بعض، الصفحة تكبر وتنزلق عموديًا ---- */
  @media (max-width:700px){
    .stage{ grid-template-columns:1fr; }
    .topbar{ padding:10px 14px; gap:8px; }
    .topbar .logo h1{ font-size:1.15rem; }
    .logo-img-sm{ width:30px; height:30px; }
    #leaveBtn{ order:2; margin-inline-start:auto; padding:8px 12px; font-size:.85rem; }
    .logo{ order:1; }
    .code-stub{ order:3; font-size:.95rem; padding:5px 10px; }
    .who{ order:4; flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .who::-webkit-scrollbar{ height:4px; }
    .chip{ flex:0 0 auto; }

    .player-zone{ padding:12px; gap:10px; }
    .video-frame{ border-width:2px; border-radius:10px; }
    .controls{ padding:10px 12px; gap:8px; }
    .seek-group{ width:100%; margin-inline-start:0; justify-content:space-between; }
    .seek-group input{ flex:1; width:auto; min-width:0; }

    .chat-zone{ border-inline-start:none; border-top:1px solid var(--line); }
    .chat-log{ max-height:46vh; min-height:180px; }
  }

  /* ---- جوال صغير جدًا ---- */
  @media (max-width:380px){
    .logo-img-lg{ width:92px; height:92px; }
    .ticket-body{ padding:20px 16px 16px; }
    .btn{ padding:11px 12px; font-size:.88rem; }
  }

  .player-zone{ display:flex; flex-direction:column; padding:20px; gap:14px; min-width:0; }
  .video-frame{
    position:relative; border-radius:14px; overflow:hidden;
    background:#000; aspect-ratio:16/9; width:100%;
    border:3px solid var(--apricot-deep);
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .video-frame iframe{ width:100%; height:100%; border:0; display:block; }
  .video-placeholder{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--muted); gap:10px; text-align:center; padding:20px;
  }
  .video-placeholder .icn{ font-size:2.2rem; }

  .load-row{ display:flex; gap:8px; }
  .load-row input{ flex:1; }

  .controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
  }
  .ctrl-btn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--cream); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .ctrl-btn:hover{ border-color:var(--apricot); color:var(--apricot); }
  .seek-group{ display:flex; align-items:center; gap:6px; margin-inline-start:auto; }
  .seek-group input{ width:80px; padding:8px 10px; font-size:.85rem; }
  .status-line{ font-size:.78rem; color:var(--muted); }

  /* ---------- chat ---------- */
  .chat-zone{
    display:flex; flex-direction:column; border-inline-start:1px solid var(--line);
    background:var(--bg-panel); min-height:0;
  }
  .chat-head{ padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; color:var(--apricot-soft); }
  .chat-log{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-height:200px; max-height:calc(100vh - 420px); }
  .msg{ max-width:88%; }
  .msg .who{ font-size:.72rem; color:var(--apricot); margin-bottom:2px; font-weight:700; }
  .msg .bubble{ background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:.88rem; line-height:1.5; }
  .msg.mine .bubble{ background:linear-gradient(155deg, #4a3350, #3a2a44); border-color:var(--apricot-deep); }
  .msg.system{ align-self:center; }
  .msg.system .bubble{ background:transparent; border:none; color:var(--muted); font-size:.76rem; padding:2px; }
  .chat-input{ display:flex; gap:6px; padding:12px 14px; border-top:1px solid var(--line); align-items:center; }
  .chat-input input{ flex:1; }
  .icon-btn{
    width:38px; height:38px; min-width:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--cream); font-size:1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .icon-btn:hover{ border-color:var(--apricot); color:var(--apricot); }
  .icon-btn.recording{ background:#5a2130; border-color:#ff6b6b; color:#ff9a9a; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,107,.5);} 50%{ box-shadow:0 0 0 6px rgba(255,107,107,0);} }

  .msg-actions{ font-size:.68rem; color:var(--muted); margin-top:3px; display:flex; gap:6px; }
  .msg.mine .msg-actions{ justify-content:flex-end; }
  .edit-link{ cursor:pointer; text-decoration:underline; }
  .edit-link:hover{ color:var(--apricot); }
  .edited-tag{ opacity:.55; font-size:.7em; margin-inline-start:4px; }
  .bubble img.chat-image{ max-width:220px; border-radius:8px; display:block; cursor:zoom-in; }
  .bubble audio.chat-audio{ max-width:230px; height:34px; }
  .edit-box{ display:flex; gap:6px; align-items:center; }
  .edit-box input{ flex:1; padding:6px 10px; font-size:.85rem; border-radius:8px; background:var(--bg-panel); border:1px solid var(--apricot); color:var(--cream); }

  .empty-state{ color:var(--muted); font-size:.85rem; text-align:center; padding:30px 10px; }
  a.plain{ color:var(--apricot); text-decoration:underline; cursor:pointer; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>

/* ============ helpers ============ */
function genCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function extractYouTubeId(input){
  if(!input) return null;
  // نظّف النص من الأحرف الخفية والمسافات الزايدة يلي أحيانًا توصل من نسخ التطبيقات
  input = input.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){
    const m = input.match(p);
    if(m) return m[1];
  }
  return null;
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
}
function ytCommand(iframe, func, args){
  if(!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify({event:'command', func, args: args || []}), '*');
}

/* ============ shareable room links ============ */
const ROOM_TTL_MS = 24 * 60 * 60 * 1000; // الغرفة تنتهي بعد 24 ساعة من إنشائها
function isRoomExpired(roomState){
  if(!roomState || !roomState.createdAt) return false;
  return (Date.now() - roomState.createdAt) > ROOM_TTL_MS;
}
function getRoomCodeFromUrl(){
  try{
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('room') || '').trim().toUpperCase();
    return code || null;
  }catch(e){ return null; }
}
const pendingRoomCode = getRoomCodeFromUrl();

function buildRoomLink(code){
  try{
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('room', code);
    return url.toString();
  }catch(e){
    return window.location.href;
  }
}
function updateUrlForRoom(code){
  try{
    const url = buildRoomLink(code);
    window.history.replaceState({}, '', url);
  }catch(e){ /* بعض البيئات (مثل content://) لا تدعم history API */ }
}
async function copyRoomLink(){
  const link = buildRoomLink(state.roomCode);
  try{
    if(navigator.share){
      await navigator.share({ title: 'مشمش', text: 'تعال شاهد معي على مشمش 🍿', url: link });
      return;
    }
  }catch(e){ /* المستخدم ألغى المشاركة أو غير مدعومة، جرب النسخ */ }
  try{
    await navigator.clipboard.writeText(link);
    state.statusMsg = 'تم نسخ رابط الغرفة ✅ شاركه مع أصدقائك';
  }catch(e){
    state.statusMsg = 'ما قدرنا ننسخ الرابط تلقائيًا، انسخه يدويًا: ' + link;
  }
  const statusEl = document.getElementById('statusLine');
  if(statusEl) statusEl.textContent = state.statusMsg;
}

/* ============ storage-backed room ops (Firebase Realtime Database) ============ */
const FIREBASE_DB_URL = 'https://mshmsh-d6437-default-rtdb.firebaseio.com';

async function fbGet(path){
  try{
    const res = await fetch(FIREBASE_DB_URL + '/' + path + '.json');
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function fbSet(path, value){
  try{
    await fetch(FIREBASE_DB_URL + '/' + path + '.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
  }catch(e){}
}
async function fbDelete(path){
  try{
    await fetch(FIREBASE_DB_URL + '/' + path + '.json', { method: 'DELETE' });
  }catch(e){}
}

async function loadMyName(){
  try{
    const name = localStorage.getItem('mshmsh-my-name');
    if(name) state.myName = name;
  }catch(e){}
}
async function saveMyName(name){
  try{ localStorage.setItem('mshmsh-my-name', name); }catch(e){}
}

async function getRoomState(code){
  const data = await fbGet('rooms/'+code+'/state');
  return data || null;
}
async function setRoomState(code, data){
  await fbSet('rooms/'+code+'/state', data);
}
async function getRoomChat(code){
  const data = await fbGet('rooms/'+code+'/chat');
  return Array.isArray(data) ? data : [];
}
async function pushChatMessage(code, msg){
  const list = await getRoomChat(code);
  list.push(msg);
  pruneChatBySize(list);
  await fbSet('rooms/'+code+'/chat', list);
}
function pruneChatBySize(list){
  const MAX_BYTES = 4 * 1024 * 1024; // هامش أمان تحت حد الـ5MB
  while(list.length > 1 && new TextEncoder().encode(JSON.stringify(list)).length > MAX_BYTES){
    list.shift();
  }
  while(list.length > 150) list.shift();
}
async function getRoomUsers(code){
  const data = await fbGet('rooms/'+code+'/users');
  return (data && typeof data === 'object') ? data : {};
}
async function touchPresence(code, name){
  const users = await getRoomUsers(code);
  users[name] = Date.now();
  // drop stale (>30s)
  for(const k in users){ if(Date.now() - users[k] > 30000) delete users[k]; }
  await fbSet('rooms/'+code+'/users', users);
  return users;
}

/* ============ actions ============ */
async function createRoom(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ showError('اكتب اسمك الأول'); return; }
  const btn = document.getElementById('createBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جاري الإنشاء...'; }
  try{
    await saveMyName(name);
    state.myName = name;
    state.roomCode = genCode();
    await setRoomState(state.roomCode, {videoId:null, isPlaying:false, updatedAt:Date.now(), updatedBy:name, seekTo:null, createdAt:Date.now()});
    try{
      await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: name + ' أنشأ الغرفة 🎬', ts:Date.now()});
    }catch(e){ /* رسالة النظام مش ضرورية لدخول الغرفة */ }
    enterRoom();
  }catch(e){
    showError('صار خطأ ولا قدرنا ننشئ الغرفة، حاول مرة ثانية');
    if(btn){ btn.disabled = false; btn.textContent = 'إنشاء غرفة جديدة'; }
  }
}
async function joinRoom(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if(!name){ showError('اكتب اسمك الأول'); return; }
  if(!code){ showError('اكتب كود الغرفة'); return; }
  const btn = document.getElementById('joinBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جاري الانضمام...'; }
  try{
    const existing = await getRoomState(code);
    if(!existing){ showError('ما فيه غرفة بهذا الكود'); if(btn){btn.disabled=false; btn.textContent='انضمام لغرفة';} return; }
    if(isRoomExpired(existing)){
      showError('انتهت صلاحية هذه الغرفة (مر عليها أكثر من 24 ساعة) — اطلب من صاحبها ينشئ غرفة جديدة');
      if(btn){ btn.disabled = false; btn.textContent = 'انضمام لغرفة'; }
      return;
    }
    await saveMyName(name);
    state.myName = name;
    state.roomCode = code;
    try{
      await pushChatMessage(code, {sys:true, id:genMsgId(), text: name + ' انضم للغرفة 👋', ts:Date.now()});
    }catch(e){ /* رسالة النظام مش ضرورية لدخول الغرفة */ }
    enterRoom();
  }catch(e){
    showError('صار خطأ ولا قدرنا ننضم للغرفة، حاول مرة ثانية');
    if(btn){ btn.disabled = false; btn.textContent = 'انضمام لغرفة'; }
  }
}
function showError(msg){
  state.errorMsg = msg;
  render();
}

function enterRoom(){
  state.screen = 'room';
  state.errorMsg = '';
  updateUrlForRoom(state.roomCode);
  render();
  startPolling();
}
function handleRoomExpired(){
  const code = state.roomCode;
  leaveRoom();
  state.errorMsg = 'انتهت صلاحية الغرفة (مر عليها أكثر من 24 ساعة) وأُغلقت تلقائيًا';
  render();
  // تنظيف تخزين الغرفة المنتهية (best-effort)
  try{
    fbDelete('rooms/'+code+'/state');
    fbDelete('rooms/'+code+'/chat');
    fbDelete('rooms/'+code+'/users');
  }catch(e){}
}
function leaveRoom(){
  stopPolling();
  state.screen = 'landing';
  state.roomCode = '';
  state.videoId = null;
  state.chat = [];
  state.users = {};
  try{
    const url = new URL(window.location.href);
    url.searchParams.delete('room');
    window.history.replaceState({}, '', url.toString());
  }catch(e){}
  render();
}

async function loadVideo(){
  const input = document.getElementById('videoInput');
  const id = extractYouTubeId(input.value);
  if(!id){
    setStatus('ما قدرت أتعرف على الفيديو من هذا الرابط — تأكد إنه رابط يوتيوب صحيح (youtube.com أو youtu.be)', true);
    return;
  }
  const data = {videoId:id, isPlaying:true, updatedAt:Date.now(), updatedBy:state.myName, seekTo:0};
  await setRoomState(state.roomCode, data);
  try{
    await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: state.myName + ' شغّل فيديو جديد 🍿', ts:Date.now()});
  }catch(e){ /* رسالة النظام مش ضرورية */ }
  input.value = '';
  setStatus('');
  applyRoomState(data);
}

async function togglePlay(){
  const cur = await getRoomState(state.roomCode) || {};
  const next = {...cur, isPlaying: !cur.isPlaying, updatedAt:Date.now(), updatedBy:state.myName, seekTo:null};
  await setRoomState(state.roomCode, next);
  applyRoomState(next);
}
async function seekBy(seconds){
  if(!iframeEl) return;
  ytCommand(iframeEl, 'getCurrentTime'); // best-effort, most browsers ignore return without full API
  // simple relative seek using postMessage command "seekTo" isn't relative, so we approximate via broadcast
  const cur = await getRoomState(state.roomCode) || {};
  const next = {...cur, updatedAt:Date.now(), updatedBy:state.myName, seekTo:{delta:seconds, ts:Date.now()}};
  await setRoomState(state.roomCode, next);
  applyRoomState(next);
}
async function jumpToInput(){
  const val = document.getElementById('jumpInput').value;
  const secs = parseInt(val, 10);
  if(isNaN(secs)) return;
  const cur = await getRoomState(state.roomCode) || {};
  const next = {...cur, updatedAt:Date.now(), updatedBy:state.myName, seekTo:{abs:secs, ts:Date.now()}};
  await setRoomState(state.roomCode, next);
  applyRoomState(next);
  document.getElementById('jumpInput').value = '';
}

let lastAppliedUpdate = 0;
function applyRoomState(data){
  if(!data) return;
  if(data.videoId !== state.videoId){
    state.videoId = data.videoId;
    render(); // rebuild iframe
  }
  if(iframeEl && data.updatedAt > lastAppliedUpdate){
    lastAppliedUpdate = data.updatedAt;
    if(data.isPlaying) ytCommand(iframeEl, 'playVideo');
    else ytCommand(iframeEl, 'pauseVideo');
    if(data.seekTo && data.seekTo.abs !== undefined){
      ytCommand(iframeEl, 'seekTo', [data.seekTo.abs, true]);
    } else if(data.seekTo && data.seekTo.delta !== undefined){
      // relative seek: request current time then seek — without full API we just nudge via seekTo using estimated time unsupported,
      // so fall back to no-op and rely on absolute jump control for precision.
    }
  }
}

let pendingMessages = [];
let editingId = null;
const EDIT_WINDOW_MS = 60 * 1000;

function genMsgId(){
  return state.myName + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
}
function setStatus(msg, isError){
  state.statusMsg = msg;
  const line = document.getElementById('statusLine');
  if(line){
    line.textContent = msg;
    line.style.color = isError ? '#ff8686' : '';
    line.style.fontWeight = isError ? '700' : 'normal';
  }
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const msg = { id: genMsgId(), name: state.myName, type:'text', text, ts: Date.now() };
  input.value = '';
  input.focus();
  // اعرض الرسالة فورًا عند المرسل، بدون انتظار التخزين المشترك
  pendingMessages.push(msg);
  state.chat = [...state.chat, msg];
  renderChatOnly();
  try{
    await pushChatMessage(state.roomCode, msg);
  }catch(e){
    setStatus('تعذر حفظ آخر رسالة، بيعاد المحاولة تلقائيًا');
  }
}

/* ---------- تعديل الرسائل خلال دقيقة ---------- */
function startEdit(id){
  const msg = state.chat.find(m => m.id === id);
  if(!msg) return;
  editingId = id;
  renderChatOnly();
  const inp = document.getElementById('editInput-' + id);
  if(inp){ inp.value = msg.text; inp.focus(); inp.select(); }
}
function cancelEdit(){
  editingId = null;
  renderChatOnly();
}
async function saveEdit(id){
  const inp = document.getElementById('editInput-' + id);
  if(!inp) return;
  const newText = inp.value.trim();
  if(!newText){ cancelEdit(); return; }
  const local = state.chat.find(m => m.id === id);
  if(local && Date.now() - local.ts > EDIT_WINDOW_MS){
    setStatus('راحت الدقيقة، ما تقدر تعدل هذي الرسالة');
    editingId = null; renderChatOnly(); return;
  }
  if(local){ local.text = newText; local.edited = true; }
  const pendingLocal = pendingMessages.find(m => m.id === id);
  if(pendingLocal){ pendingLocal.text = newText; pendingLocal.edited = true; }
  editingId = null;
  renderChatOnly();
  const ok = await editChatMessage(state.roomCode, id, newText);
  if(!ok) setStatus('تعذر حفظ التعديل، حاول مرة ثانية');
}
async function editChatMessage(code, id, newText){
  try{
    const list = await getRoomChat(code);
    const idx = list.findIndex(m => m.id === id);
    if(idx === -1) return true; // لسه ما وصلت للتخزين، رح تنحفظ بالنص الجديد عند أول push
    const m = list[idx];
    if(m.name !== state.myName) return false;
    if(Date.now() - m.ts > EDIT_WINDOW_MS) return false;
    m.text = newText;
    m.edited = true;
    m.editedAt = Date.now();
    list[idx] = m;
    await fbSet('rooms/'+code+'/chat', list);
    return true;
  }catch(e){ return false; }
}

/* ---------- إرسال صورة ---------- */
function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function sendImageFile(file){
  if(!file || !file.type.startsWith('image/')){ setStatus('اختر ملف صورة صحيح'); return; }
  try{
    setStatus('جاري تجهيز الصورة...');
    const dataUrl = await resizeImageFile(file);
    const approxBytes = dataUrl.length * 0.75;
    if(approxBytes > 1.6 * 1024 * 1024){
      setStatus('الصورة كبيرة شوي حتى بعد الضغط، جرب صورة ثانية');
      return;
    }
    const msg = { id: genMsgId(), name: state.myName, type:'image', dataUrl, ts: Date.now() };
    pendingMessages.push(msg);
    state.chat = [...state.chat, msg];
    renderChatOnly();
    setStatus('');
    await pushChatMessage(state.roomCode, msg);
  }catch(e){
    setStatus('تعذر إرسال الصورة');
  }
}

/* ---------- تسجيل رسالة صوتية ---------- */
let mediaRecorder = null;
let audioChunks = [];
let recordStartTs = null;
let recordTimerInterval = null;

async function toggleRecording(){
  const micBtn = document.getElementById('micBtn');
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('التسجيل الصوتي مو مدعوم بهالمتصفح، جرب افتح الملف مباشرة بمتصفح حديث');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimerInterval);
      const btn = document.getElementById('micBtn');
      if(btn){ btn.classList.remove('recording'); btn.textContent = '🎤'; btn.title = 'رسالة صوتية'; }
      const blob = new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      if(blob.size < 500) return; // تسجيل قصير جدًا/فارغ
      const durationSec = Math.max(1, Math.round((Date.now() - recordStartTs) / 1000));
      const reader = new FileReader();
      reader.onload = async () => {
        const dataUrl = reader.result;
        const approxBytes = dataUrl.length * 0.75;
        if(approxBytes > 3 * 1024 * 1024){
          setStatus('المقطع الصوتي طويل شوي، سجل مقطع أقصر');
          return;
        }
        const msg = { id: genMsgId(), name: state.myName, type:'audio', dataUrl, duration: durationSec, ts: Date.now() };
        pendingMessages.push(msg);
        state.chat = [...state.chat, msg];
        renderChatOnly();
        try{ await pushChatMessage(state.roomCode, msg); }catch(e){ setStatus('تعذر إرسال المقطع الصوتي'); }
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    recordStartTs = Date.now();
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹️';
    let secs = 0;
    recordTimerInterval = setInterval(() => {
      secs++;
      micBtn.title = 'إيقاف التسجيل (' + secs + 'ث)';
      if(secs >= 60) mediaRecorder.stop(); // حد أقصى للحجم
    }, 1000);
  }catch(e){
    setStatus('ما قدرنا نوصل للمايك — تأكد من إعطاء صلاحية الميكروفون، أو افتح الملف مباشرة بالمتصفح بدل المعاينة');
  }
}

/* ============ polling ============ */
function startPolling(){
  poll();
  pollTimer = setInterval(poll, 2500);
}
function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}
async function poll(){
  if(!state.roomCode) return;
  const [rs, chat, users] = await Promise.all([
    getRoomState(state.roomCode),
    getRoomChat(state.roomCode),
    touchPresence(state.roomCode, state.myName)
  ]);
  if(isRoomExpired(rs)){
    handleRoomExpired();
    return;
  }
  state.users = users;
  // ادمج رسائل التخزين مع أي رسائل محلية لسه ما تأكدنا انها انحفظت
  const fetchedIds = new Set(chat.filter(m => m.id).map(m => m.id));
  pendingMessages = pendingMessages.filter(m => !fetchedIds.has(m.id));
  const merged = [...chat, ...pendingMessages].sort((a,b) => a.ts - b.ts);
  const chatChanged = JSON.stringify(merged) !== JSON.stringify(state.chat);
  state.chat = merged;
  applyRoomState(rs);
  renderTopbarOnly();
  if(chatChanged) renderChatOnly();
}

function renderChatOnly(){
  const log = document.getElementById('chatLog');
  if(!log) return;
  if(!state.chat.length){
    log.innerHTML = `<div class="empty-state">ما فيه رسائل بعد، ابدأ الدردشة 👋</div>`;
    return;
  }
  const wasNearBottom = (log.scrollHeight - log.scrollTop - log.clientHeight) < 60;
  let preservedEditValue = null;
  if(editingId){
    const existingInp = document.getElementById('editInput-' + editingId);
    if(existingInp) preservedEditValue = existingInp.value;
  }

  log.innerHTML = state.chat.map(m => {
    if(m.sys){
      return `<div class="msg system"><div class="bubble">${escapeHtml(m.text)}</div></div>`;
    }
    const mine = m.name === state.myName;
    const isEditingThis = editingId === m.id;
    const canEdit = mine && m.type === 'text' && !isEditingThis && (Date.now() - m.ts < EDIT_WINDOW_MS);

    let bodyHtml;
    if(isEditingThis){
      bodyHtml = `<div class="edit-box">
        <input id="editInput-${m.id}" type="text">
      </div>`;
    } else if(m.type === 'image'){
      bodyHtml = `<img class="chat-image" src="${m.dataUrl}" onclick="window.open(this.src)" alt="صورة">`;
    } else if(m.type === 'audio'){
      bodyHtml = `<audio class="chat-audio" controls src="${m.dataUrl}"></audio>`;
    } else {
      bodyHtml = escapeHtml(m.text) + (m.edited ? `<span class="edited-tag">(معدّلة)</span>` : '');
    }

    let actionsHtml = '';
    if(isEditingThis){
      actionsHtml = `<div class="msg-actions">
        <span class="edit-link" data-save="${m.id}">حفظ</span>
        <span class="edit-link" data-cancel="${m.id}">إلغاء</span>
      </div>`;
    } else if(canEdit){
      actionsHtml = `<div class="msg-actions"><span class="edit-link" data-edit="${m.id}">تعديل</span></div>`;
    }

    return `
      <div class="msg ${mine?'mine':''}" data-id="${m.id}">
        <div class="who">${escapeHtml(m.name)} · ${fmtTime(m.ts)}</div>
        <div class="bubble">${bodyHtml}</div>
        ${actionsHtml}
      </div>`;
  }).join('');

  if(wasNearBottom) log.scrollTop = log.scrollHeight;

  log.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => startEdit(el.getAttribute('data-edit')));
  log.querySelectorAll('[data-save]').forEach(el => el.onclick = () => saveEdit(el.getAttribute('data-save')));
  log.querySelectorAll('[data-cancel]').forEach(el => el.onclick = cancelEdit);

  if(editingId){
    const inp = document.getElementById('editInput-' + editingId);
    const msg = state.chat.find(m => m.id === editingId);
    if(inp && msg){
      inp.value = preservedEditValue !== null ? preservedEditValue : msg.text;
      inp.focus();
      inp.select();
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter') saveEdit(editingId);
        if(e.key === 'Escape') cancelEdit();
      });
    }
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ============ init ============ */
(async function init(){
  await loadMyName();
  render();
  if(pendingRoomCode){
    const existing = await getRoomState(pendingRoomCode);
    if(!existing){
      state.errorMsg = 'رابط الدعوة غير صالح — ما فيه غرفة بهذا الكود';
      render();
    } else if(isRoomExpired(existing)){
      state.errorMsg = 'انتهت صلاحية رابط الدعوة هذا (مر عليه أكثر من 24 ساعة)';
      render();
    }
  }
})();
</script>
