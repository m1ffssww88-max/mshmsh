<meta name="theme-color" content="#1B1420">
<style>
  :root{
    --bg-deep:#1B1420;
    --bg-panel:#241A2B;
    --bg-panel-2:#2E2136;
    --line:#3D2E45;
    --apricot:#FF9F5B;
    --apricot-deep:#E8763A;
    --apricot-soft:#FFD9A8;
    --cream:#F6ECD9;
    --muted:#B9A9C2;
    --ok:#8FD19E;
  }
  html{ overflow-x:hidden; width:100%; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #2A1E33 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #24202f 0%, transparent 40%),
      var(--bg-deep);
    color:var(--cream);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    min-height:100dvh; /* يمنع قفزة التخطيط عند فتح لوحة المفاتيح بالجوال */
    width:100%;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Lalezar', 'Cairo', sans-serif; letter-spacing:.5px; }

  /* ---------- تصليح: كل حقول الكتابة لازم يكون لها خلفية/لون واضح صراحةً،
     وإلا بعض متصفحات الجوال (وضع Dark القسري) تخفي النص المكتوب (نص أبيض على خلفية بيضاء) ---------- */
  input[type="text"], input[type="search"]{
    background:var(--bg-panel-2); color:var(--cream); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; font-family:'Cairo'; font-size:16px; outline:none;
    color-scheme: dark; caret-color:var(--apricot);
  }
  /* ملاحظة: font-size لازم يكون 16px بالضبط (مو أقل) على كل حقول الكتابة،
     وإلا سفاري بالآيفون يسوي تقريب (Zoom) تلقائي للصفحة كلها عند فتح لوحة المفاتيح */
  input[type="text"]:focus, input[type="search"]:focus{ border-color:var(--apricot); }

  /* ---------- perforated film strip decoration ---------- */
  .film-edge{
    height:14px;
    background-image: radial-gradient(circle, var(--bg-deep) 3.5px, transparent 3.6px);
    background-size: 18px 14px;
    background-position: 6px center;
    background-color: var(--apricot-deep);
  }

  /* ---------- landing ---------- */
  .landing{
    min-height:100vh;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:28px;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
  }
  .logo-img{
    display:block; border-radius:50%;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));
  }
  .logo-img-lg{ width:120px; height:120px; }
  .logo-img-sm{ width:36px; height:36px; }
  .logo .fruit{
    width:44px; height:44px; border-radius:50% 50% 50% 4px;
    background:linear-gradient(155deg, var(--apricot-soft), var(--apricot-deep));
    box-shadow: inset -6px -6px 10px rgba(0,0,0,.25);
    position:relative;
  }
  .logo .fruit::after{
    content:"";
    position:absolute; top:-6px; left:50%; transform:translateX(-50%) rotate(20deg);
    width:3px; height:14px; background:#7a9b5c; border-radius:2px;
  }
  .logo h1{ font-size:2.6rem; color:var(--apricot); text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .tagline{ color:var(--muted); font-size:1rem; text-align:center; max-width:360px; }

  .ticket{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:18px;
    width:100%; max-width:380px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .ticket-body{ padding:26px 24px 20px; display:flex; flex-direction:column; gap:14px; }
  .field label{ font-size:.8rem; color:var(--muted); display:block; margin-bottom:6px; }
  .field input{
    width:100%; padding:12px 14px; border-radius:10px;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cream);
    font-family:'Cairo'; font-size:1rem; outline:none;
  }
  .field input:focus{ border-color:var(--apricot); }
  .row{ display:flex; gap:10px; }
  .btn{
    border:none; border-radius:10px; padding:12px 16px;
    font-family:'Cairo'; font-weight:700; font-size:.95rem; cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(155deg, var(--apricot-soft), var(--apricot-deep)); color:#2a1810; flex:1; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--cream); }
  .btn-ghost:hover{ border-color:var(--apricot); }
  .divider-text{ text-align:center; color:var(--muted); font-size:.8rem; position:relative; margin:2px 0; }
  .err{ color:#ff8686; font-size:.82rem; min-height:1em; }

  /* ---------- room ---------- */
  .room{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--bg-panel); border-bottom:1px solid var(--line);
    gap:14px; flex-wrap:wrap;
  }
  .topbar .logo{ min-width:0; flex-shrink:1; }
  .topbar .logo h1{ font-size:1.5rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .who{ flex-shrink:0; }
  .code-stub{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-panel-2); border:1px dashed var(--apricot); border-radius:10px;
    padding:6px 12px; font-family:'Lalezar'; letter-spacing:2px; color:var(--apricot-soft);
    cursor:pointer; font-size:1.1rem;
  }
  .code-stub small{ font-family:'Cairo'; color:var(--muted); font-size:.7rem; letter-spacing:0; }
  .who{ position:relative; display:flex; align-items:center; }
  .who-toggle{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cream);
    border-radius:999px; padding:6px 14px; font-family:'Cairo'; font-weight:700; font-size:.85rem;
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .who-toggle:hover{ border-color:var(--apricot); }
  .who-panel{
    position:absolute; top:calc(100% + 8px); left:0; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:12px; padding:10px; display:none; flex-direction:column; gap:6px; min-width:170px;
    max-height:260px; overflow-y:auto; box-shadow:0 10px 30px rgba(0,0,0,.45); z-index:80;
  }
  .who-panel.open{ display:flex; }
  .chip{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:999px;
    padding:5px 12px; font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:6px;
  }
  .chip.me{ color:var(--apricot-soft); border-color:var(--apricot); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }

  .stage{
    flex:1; display:grid; gap:0; min-height:0;
    width:100%; max-width:1500px; margin:0 auto;
    grid-template-columns:1fr 360px;
    grid-template-rows:auto 1fr;
    grid-template-areas:
      "player chat"
      "controls chat";
  }
  .player-zone{ grid-area:player; }
  .chat-zone{ grid-area:chat; }
  .controls-zone{ grid-area:controls; display:flex; flex-direction:column; gap:14px; padding:0 20px 20px; min-width:0; }

  /* ============================================================
     قياسات حسب نوع الجهاز:
     - جوال: 0 – 700px (تحته بلوك خاص بالجوال بالأسفل)
     - آيباد/تابلت: 701px – 1180px
     - لابتوب: 1181px – 1440px
     - ديسكتوب/شاشة كبيرة: 1441px فما فوق (هذي هي القياسات الأساسية بدون media query)
     ============================================================ */

  /* ---- آيباد/تابلت: عمود دردشة أضيق شوي، وأزرار أكبر شوي تناسب اللمس ---- */
  @media (max-width:1180px) and (min-width:701px){
    .stage{ grid-template-columns:1fr 320px; }
    .player-zone{ padding:18px; gap:14px; }
    .controls-zone{ padding:0 18px 18px; }
    .topbar{ padding:14px 20px; }
    .topbar .logo h1{ font-size:1.3rem; }
    .logo-img-sm{ width:34px; height:34px; }
    .btn{ padding:13px 17px; font-size:.95rem; }
    .ptab{ width:46px; height:46px; font-size:1.2rem; }
    .ctrl-btn{ width:46px; height:46px; font-size:1.2rem; }
    .icon-btn{ width:42px; height:42px; min-width:42px; font-size:1.05rem; }
    .chat-log{ max-height:calc(100vh - 380px); max-height:calc(100dvh - 380px); }
  }

  /* ---- لابتوب: نفس تخطيط الديسكتوب بس عمود أضيق ومساحة أقل هدر عشان الشاشات المتوسطة ---- */
  @media (max-width:1440px) and (min-width:1181px){
    .stage{ max-width:1280px; grid-template-columns:1fr 330px; }
    .player-zone{ padding:18px; }
    .controls-zone{ padding:0 18px 18px; }
  }

  /* ---- جوال: الفيديو، ثم الدردشة مباشرة تحته، وبعدها أزرار التحكم ---- */
  @media (max-width:700px){
    .stage{
      grid-template-columns:1fr;
      grid-template-rows:auto auto auto;
      grid-template-areas:
        "player"
        "chat"
        "controls";
    }
    /* لما تفتح لوحة المفاتيح (كلاس kb-open ينضاف من الجافاسكربت) نخفي شريط التحكم
       عشان تبقى مساحة أكبر لصندوق الكتابة فوق لوحة المفاتيح مباشرة، والفيديو يضل ثابت بالأعلى */
    body.kb-open .controls-zone{ display:none; }
    /* حل مؤقت: كبسنا شريط الأعلى (بادينغ أقل) عشان الفيديو يطلع لفوق ويستفيد من المساحة */
    .topbar{ padding:6px 10px; gap:6px; }
    .topbar .logo h1{ font-size:1.15rem; }
    .logo-img-sm{ width:22px; height:22px; }
    #leaveBtn{ order:3; margin-inline-start:auto; padding:8px 12px; font-size:.85rem; }
    .logo{ order:1; }
    .games-menu-wrap{ order:2; }
    .search-btn{ order:2; }
    .code-stub{ order:4; font-size:.95rem; padding:5px 10px; }
    .who{ order:5; }
    /* زر "رابط الدعوة" الكبير مكرر مع أيقونة 🔗 الموجودة جنب صندوق الكتابة تحت،
       وعلى الجوال كان يزاحم بقية الأيقونات ويضيّق عليها. نخفيه هنا بس ونعتمد على نسخة صندوق الكتابة */
    #shareLinkBtn{ display:none !important; }
    /* مؤقتًا مخفية كود الغرفة (حسب الطلب) — لإرجاعها لاحقًا احذف السطر تحت فقط */
    .code-stub{ display:none !important; }

    .player-zone{ padding:8px 12px 6px; gap:8px; }
    .video-frame{ border-width:2px; border-radius:10px; }
    .video-frame.ratio-9x16{ max-width:280px; }
    .platform-tabs{ gap:6px; }
    .ptab{ width:38px; height:38px; font-size:1rem; }
    .controls{ padding:10px 12px; gap:8px; }
    .controls-zone{ padding:12px; gap:10px; }

    .chat-zone{ border-inline-start:none; border-top:none; border-bottom:1px solid var(--line); }
    .chat-log{ max-height:38vh; max-height:38dvh; min-height:160px; }
    /* وإنت تكتب: نخفي رأس الدردشة وسجل الرسائل عشان صندوق الكتابة يضل ملزوق تحت الفيديو مباشرة وتظل تشوف الفيديو */
    body.kb-open .chat-head{ display:none; }
    body.kb-open .chat-log{ display:none; }
    body.kb-open .chat-zone{ border-bottom:none; }
  }

  /* ---- جوال صغير جدًا ---- */
  @media (max-width:380px){
    .logo-img-lg{ width:92px; height:92px; }
    .ticket-body{ padding:20px 16px 16px; }
    .btn{ padding:11px 12px; font-size:.88rem; }
  }

  .player-zone{ display:flex; flex-direction:column; padding:20px; gap:14px; min-width:0; }
  .video-frame{
    position:relative; border-radius:14px; overflow:hidden;
    background:#000; aspect-ratio:16/9; width:100%;
    border:3px solid var(--apricot-deep);
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    transition:aspect-ratio .2s ease, max-width .2s ease;
  }
  .video-frame.ratio-9x16{ aspect-ratio:9/16; max-width:420px; margin:0 auto; }
  .video-frame iframe, .video-frame video{ width:100%; height:100%; border:0; display:block; }

  /* ---------- زر صغير + شريط أزرار التقليب فوق الفيديو (للقائد فقط) ---------- */
  /* ملاحظة: إطار يوتيوب/الفيديو المباشر أصبح pointer-events:none (نحقنها بالجافاسكربت) حتى ما يقدر أي أحد
     يضغط مباشرة على مشغّل يوتيوب الأصلي (وياخذه لتطبيق يوتيوب بالغلط). التشغيل التلقائي ما يحتاج ضغطة على
     الإطار لأن autoplay مفوّض عبر iframe.allow="autoplay"، فحجب الضغطات ما يكسر التشغيل. */
  .voc-toggle{
    position:absolute; bottom:10px; inset-inline-start:10px; z-index:7;
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.16); color:#fff; font-size:1.1rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  .video-overlay-controls{
    position:absolute; inset:0; z-index:6; display:none; flex-direction:column;
    align-items:center; justify-content:flex-end; gap:12px; padding:14px;
    background:linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 45%, transparent 75%);
    pointer-events:none;
  }
  .video-overlay-controls.show{ display:flex; pointer-events:auto; }
  .voc-buttons{ display:flex; align-items:center; justify-content:center; gap:24px; }
  .voc-btn{
    width:50px; height:50px; border-radius:50%; border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.14); color:#fff; font-size:1.15rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px); transition:background .15s ease;
  }
  .voc-btn:active{ background:rgba(255,255,255,.3); }
  .voc-btn.voc-btn-main{ width:60px; height:60px; font-size:1.35rem; background:rgba(255,255,255,.2); }
  .voc-progress-wrap{ width:100%; padding:8px 0; cursor:pointer; touch-action:none; }
  .voc-progress{ position:relative; width:100%; height:4px; border-radius:4px; background:rgba(255,255,255,.28); overflow:visible; transition:height .12s ease; }
  .voc-progress-wrap.dragging .voc-progress, .voc-progress-wrap:active .voc-progress{ height:6px; }
  .voc-progress-fill{ height:100%; width:0%; background:#fff; border-radius:4px; position:relative; }
  .voc-progress-fill::after{
    content:''; position:absolute; top:50%; inset-inline-end:-6px; transform:translateY(-50%);
    width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.4);
    opacity:0; transition:opacity .12s ease;
  }
  .voc-progress-wrap.dragging .voc-progress-fill::after, .voc-progress-wrap:active .voc-progress-fill::after{ opacity:1; }
  .voc-time{ font-size:.72rem; color:#fff; opacity:.9; direction:ltr; text-align:center; margin-top:2px; }

  /* ---------- زر مقترحات فوق الفيديو (يفتح قائمة يدويًا بأي وقت — للقائد فقط) ---------- */
  .voc-suggest-btn{
    position:absolute; top:10px; inset-inline-start:10px; z-index:8;
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.55);
    background:rgba(0,0,0,.4); color:#fff; font-size:1.05rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  .voc-suggest-panel{
    position:absolute; inset:0; z-index:9; display:none; flex-direction:column;
    padding:14px; gap:10px; background:rgba(18,10,28,.94); overflow:hidden;
  }
  .voc-suggest-panel.open{ display:flex; }
  .vsp-head{ display:flex; align-items:center; justify-content:space-between; color:#fff; font-weight:700; font-size:.95rem; }
  .vsp-close{
    width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12); color:#fff; font-size:1rem; cursor:pointer; line-height:1;
  }
  .vsp-status{ color:#fff; opacity:.85; text-align:center; padding:24px 0; font-size:.85rem; }
  .vsp-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:10px; overflow-y:auto; padding-bottom:4px; }
  .vsp-card{
    display:flex; flex-direction:column; gap:4px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:6px; cursor:pointer;
    color:#fff; text-align:start; font-size:.7rem;
  }
  .vsp-card:active{ background:rgba(255,255,255,.18); }
  .vsp-card img{ width:100%; border-radius:6px; aspect-ratio:16/9; object-fit:cover; display:block; }
  .vsp-card span{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25; }
  @media (max-width:700px){
    .voc-btn{ width:44px; height:44px; font-size:1rem; }
    .voc-btn.voc-btn-main{ width:52px; height:52px; font-size:1.15rem; }
    .voc-buttons{ gap:18px; }
  }

  /* ---------- platform tabs ---------- */
  .platform-tabs{ display:flex; gap:8px; }
  .ptab{
    width:42px; height:42px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--cream); font-size:1.15rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .ptab:hover{ border-color:var(--apricot); }
  .ptab.active{ border-color:var(--apricot); background:linear-gradient(155deg, var(--apricot-soft), var(--apricot-deep)); color:#2a1810; }
  .hint-note{ font-size:.78rem; color:var(--muted); background:var(--bg-panel-2); border:1px dashed var(--line); border-radius:10px; padding:8px 12px; }

  /* ---------- YouTube in-app search + confirm ---------- */
  .yt-overlay{
    position:fixed; inset:0; z-index:500; background:rgba(10,7,13,.82);
    display:none; flex-direction:column; backdrop-filter:blur(2px);
  }
  .yt-overlay.open{ display:flex; }
  .yt-sheet{
    margin-top:auto; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:20px 20px 0 0; max-height:88vh; display:flex; flex-direction:column;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
  }
  .yt-sheet-head{ display:flex; align-items:center; gap:10px; padding:16px 16px 8px; }
  .yt-sheet-head h3{ flex:1; font-size:1.2rem; color:var(--apricot-soft); }
  .yt-close{ background:transparent; border:none; color:var(--muted); font-size:1.3rem; cursor:pointer; padding:4px 8px; }
  .yt-search-row{ display:flex; gap:8px; padding:0 16px 12px; }
  .yt-search-row input{
    flex:1; padding:12px 14px; border-radius:10px; background:var(--bg-panel-2);
    border:1px solid var(--line); color:var(--cream); font-family:'Cairo'; font-size:.95rem; outline:none;
  }
  .yt-search-row input:focus{ border-color:var(--apricot); }
  .yt-results{ overflow-y:auto; padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .yt-result-card{
    display:flex; gap:10px; background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:12px; padding:8px; cursor:pointer; text-align:right; transition:border-color .15s ease;
  }
  .yt-result-card:active{ border-color:var(--apricot); }
  .yt-result-card img{ width:112px; height:63px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#000; }
  .yt-result-info{ display:flex; flex-direction:column; justify-content:center; gap:4px; min-width:0; }
  .yt-result-title{ font-size:.88rem; color:var(--cream); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .yt-result-channel{ font-size:.75rem; color:var(--muted); }
  .yt-search-state{ color:var(--muted); font-size:.85rem; text-align:center; padding:24px 0; }

  .yt-confirm-overlay{
    position:fixed; inset:0; z-index:600; background:rgba(10,7,13,.85);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .yt-confirm-overlay.open{ display:flex; }
  .yt-confirm-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:16px;
    max-width:340px; width:100%; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .yt-confirm-card img{ width:100%; height:190px; object-fit:cover; display:block; }
  .yt-confirm-body{ padding:16px; display:flex; flex-direction:column; gap:12px; }
  .yt-confirm-body p{ font-size:.95rem; color:var(--cream); text-align:center; }
  .yt-confirm-title{ font-size:.85rem; color:var(--muted); text-align:center; }
  .yt-confirm-actions{ display:flex; gap:10px; }
  .yt-confirm-actions .btn{ flex:1; }
  .queue-nav{
    display:flex; align-items:center; gap:10px; justify-content:center;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
  }
  .generic-fallback-link{
    display:block; text-align:center; color:var(--apricot); font-size:.82rem; margin-top:-4px; text-decoration:underline;
  }
  .video-placeholder{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--muted); gap:10px; text-align:center; padding:20px;
  }
  .video-placeholder .icn{ font-size:2.2rem; }

  .load-row{ display:flex; gap:8px; }
  .load-row input{ flex:1; }

  .controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
  }
  .ctrl-btn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--cream); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .ctrl-btn:hover{ border-color:var(--apricot); color:var(--apricot); }
  .status-line{ font-size:.78rem; color:var(--muted); }

  /* ---------- chat ---------- */
  .chat-zone{
    display:flex; flex-direction:column; border-inline-start:1px solid var(--line);
    background:var(--bg-panel); min-height:0;
  }
  .chat-head{ padding:8px 16px; border-bottom:1px solid var(--line); font-weight:700; color:var(--apricot-soft); font-size:1rem; }
  .chat-log{
    flex:1; overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:4px;
    min-height:200px; max-height:calc(100vh - 420px); max-height:calc(100dvh - 420px);
    /* ملاحظة أداء: كانت هذي الخلفية متحركة (gradient animation) بشكل مستمر طول ما الغرفة مفتوحة،
       وهذا كان السبب الرئيسي بثقل التطبيق (إعادة رسم مستمرة لمنطقة كبيرة قابلة للتمرير).
       خليناها ثابتة بنفس الألوان عشان يخف الحمل ويصير التطبيق أخف وأسرع. */
    background:linear-gradient(135deg, #241A2B, #3a2a44 45%, #2E2136);
  }
  .msg{ max-width:88%; }
  .msg .who{ font-size:.72rem; color:var(--apricot); margin-bottom:1px; font-weight:700; }
  .msg .bubble{ background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:.88rem; line-height:1.4; }
  .msg.mine .bubble{ background:linear-gradient(155deg, #4a3350, #3a2a44); border-color:var(--apricot-deep); }
  /* ---------- تلوين الرسائل حسب جنس المرسل: أزرق للولد ووردي للبنت — يظهر لكل الأعضاء ---------- */
  .msg.gender-boy .who{ color:#4FC3F7; }
  .msg.gender-boy .bubble{ border-color:#4FC3F7; box-shadow:0 0 0 1px rgba(79,195,247,.18) inset; }
  .msg.gender-boy.mine .bubble{ background:linear-gradient(155deg, #234a5c, #1c3a48); border-color:#4FC3F7; }
  .msg.gender-girl .who{ color:#FF9FC7; }
  .msg.gender-girl .bubble{ border-color:#FF9FC7; box-shadow:0 0 0 1px rgba(255,159,199,.18) inset; }
  .msg.gender-girl.mine .bubble{ background:linear-gradient(155deg, #5c2340, #481c33); border-color:#FF9FC7; }
  .msg.system{ align-self:center; }
  .msg.system .bubble{ background:transparent; border:none; color:var(--muted); font-size:.76rem; padding:2px; }
  .chat-input{ display:flex; gap:6px; padding:12px 14px; border-top:1px solid var(--line); align-items:center; }
  .chat-input input{ flex:1; }
  .icon-btn{
    width:38px; height:38px; min-width:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--cream); font-size:1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .icon-btn:hover{ border-color:var(--apricot); color:var(--apricot); }
  .icon-btn .ico{ width:18px; height:18px; }
  .btn-primary .ico{ width:17px; height:17px; vertical-align:-3px; margin-inline-start:4px; }
  .icon-btn.recording{ background:#5a2130; border-color:#ff6b6b; color:#ff9a9a; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,107,.5);} 50%{ box-shadow:0 0 0 6px rgba(255,107,107,0);} }

  /* ---------- قائمة ألعاب الغرفة ---------- */
  .games-menu-wrap{ position:relative; }
  .icon-btn.games-btn{ position:relative; color:var(--apricot-soft); border-color:var(--apricot-deep); }
  .icon-btn.games-btn.has-live-game::after{
    content:""; position:absolute; top:-2px; left:-2px; width:9px; height:9px; border-radius:50%;
    background:var(--ok); border:2px solid var(--bg-panel); animation:pulse 1.6s infinite;
  }
  .games-menu{
    position:absolute; top:calc(100% + 8px); left:0; z-index:90; display:none; flex-direction:column; gap:4px;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:10px;
    min-width:210px; box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .games-menu.open{ display:flex; }
  .games-menu-title{ font-size:.78rem; color:var(--muted); padding:2px 6px 6px; }
  .game-item{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:9px; padding:9px 12px;
    color:var(--cream); font-family:'Cairo'; font-weight:700; font-size:.9rem; text-align:right; cursor:pointer;
  }
  .game-item:hover{ border-color:var(--apricot); }
  .game-item.disabled{ opacity:.5; cursor:default; font-weight:400; font-size:.8rem; }

  /* ---------- لوحة اللعبة (تظهر تحت الفيديو مباشرة) ---------- */
  .game-panel{
    background:var(--bg-panel); border:1px solid var(--apricot-deep); border-radius:14px;
    padding:14px; display:flex; flex-direction:column; gap:12px; align-items:center;
  }
  .game-panel-head{ width:100%; display:flex; align-items:center; justify-content:space-between; font-weight:700; color:var(--apricot-soft); }
  .game-panel-actions{ display:flex; gap:6px; }
  .mini-btn{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; padding:5px 10px;
    color:var(--cream); font-family:'Cairo'; font-size:.75rem; cursor:pointer;
  }
  .mini-btn:hover{ border-color:var(--apricot); color:var(--apricot); }
  .ttt-status{ font-size:.88rem; color:var(--muted); text-align:center; }
  .ttt-board{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%; max-width:260px;
  }
  .ttt-cell{
    aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--bg-panel-2);
    font-family:'Lalezar'; font-size:1.8rem; cursor:pointer; color:var(--cream); transition:.15s;
    display:flex; align-items:center; justify-content:center;
  }
  .ttt-cell:not(:disabled):hover{ border-color:var(--apricot); }
  .ttt-cell:disabled{ cursor:default; }

<body>

<div id="app"></div>

<!-- نافذة البحث داخل يوتيوب (داخل مشمش مباشرة) -->
<div class="yt-overlay" id="ytSearchOverlay">

<script>
/* ============ حل قوي لمشكلة الزوم القوي عند الضغط على خانة الكتابة بالجوال ============
   بعض متصفحات/ويبفيوز الجوال تسوي تكبير (zoom) تلقائي للصفحة لحظة ما تفتح لوحة المفاتيح،
   حتى لو الفونت 16px مضبوط صح. الحل المجرب: نعيد كتابة meta viewport بسرعة (نشيل ونرجّع القيمة)
   وقت التركيز/فقدان التركيز على الحقل، وهالشي يجبر المتصفح يصفّر مستوى الزوم فورًا. */
function resetZoomHack(){
  const meta = document.querySelector('meta[name="viewport"]');
  if(!meta) return;
  const original = meta.getAttribute('content');
  meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
  requestAnimationFrame(() => {
    setTimeout(() => { meta.setAttribute('content', original); }, 60);
  });
}

/* ============ تصليح تخطيط الشاشة عند فتح لوحة المفاتيح (جوال) ============
   المشكلة: بعض المتصفحات/الويبفيوز ما تتعامل صح مع dvh عند فتح الكيبورد، فيصير إما
   تقريب (zoom) على الصفحة كلها أو تغطية لحقل الكتابة. الحل هنا مباشر وبسيط:
   نحسب بالجافاسكربت المساحة المتاحة فعليًا لصندوق الدردشة (chatLog) ونحدد
   ارتفاعه بالبكسل مباشرة (مو وحدات CSS غريبة قد ما تكون مدعومة بكل المتصفحات)،
   بحيث الفيديو يضل ثابت بالأعلى وصندوق الكتابة يضل ظاهر فوق لوحة المفاتيح. */
(function(){
  function isMobile(){ return window.innerWidth <= 700; }
  function getVpHeight(){
    return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  }
  function adjustChatLayout(){
    const vh = getVpHeight();
    const kbOpen = (window.innerHeight - vh) > 120;
    document.body.classList.toggle('kb-open', kbOpen);

    if(!isMobile()){
      const log = document.getElementById('chatLog');
      if(log) log.style.maxHeight = '';
      return;
    }
    const log = document.getElementById('chatLog');
    const chatZone = log ? log.closest('.chat-zone') : null;
    if(!log || !chatZone) return;
    const composer = chatZone.querySelector('.chat-input');
    const replyBar = chatZone.querySelector('#replyBarHolder');
    const head = chatZone.querySelector('.chat-head');
    const composerH = (composer ? composer.offsetHeight : 60) + (replyBar ? replyBar.offsetHeight : 0);
    const headH = head ? head.offsetHeight : 0;
    const zoneTop = chatZone.getBoundingClientRect().top;
    // المساحة المتبقية أسفل بداية صندوق الدردشة، بعد طرح شريط العنوان وصندوق الكتابة، مع هامش أمان بسيط
    let available = vh - zoneTop - headH - composerH - 8;
    if(!isFinite(available) || available < 120) available = 120;
    log.style.maxHeight = available + 'px';
    // نلزق آخر رسالة بأعلى صندوق الكتابة كل ما تتغير المساحة المتاحة (مثلاً عند فتح الكيبورد)
    log.scrollTop = log.scrollHeight;
  }
  adjustChatLayout();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', adjustChatLayout);
    window.visualViewport.addEventListener('scroll', adjustChatLayout);
  }
  window.addEventListener('resize', adjustChatLayout);
  window.addEventListener('orientationchange', () => setTimeout(adjustChatLayout, 300));
  // نعيد الحساب دوريًا بشكل خفيف لأن بعض المتصفحات ما تطلق أحداث دقيقة أثناء ظهور/اختفاء الكيبورد
  setInterval(adjustChatLayout, 700);

  // عند التركيز على حقل الكتابة، نتأكد إنه يظهر فوق لوحة المفاتيح مباشرة بدون ما يهرب الفيديو
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if(t && t.tagName === 'INPUT' && (t.type === 'text' || t.type === 'search')){
      setTimeout(() => {
        adjustChatLayout();
        t.scrollIntoView({block:'nearest', behavior:'smooth'});
      }, 250);
    }
  });
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if(t && t.tagName === 'INPUT'){
      setTimeout(adjustChatLayout, 200);
    }
  });
  window.mshmshAdjustChatLayout = adjustChatLayout;
})();

const YT_API_KEY = "AIzaSyAVdFSVyvqt0ltcGV_5NUOnkWkadYhS2no";
let ytPendingSelection = null; // {videoId, title, thumb}

function openYtSearchOverlay(){
  const ov = document.getElementById('ytSearchOverlay');
  if(!ov) return;
  ov.classList.add('open');
  const input = document.getElementById('ytSearchInput');
  if(input){ input.value = ''; setTimeout(() => input.focus(), 50); }
  const grid = document.getElementById('ytResultsGrid');
  if(grid) grid.innerHTML = '<div class="yt-search-state">اكتب كلمة وابحث، وستظهر النتائج هنا 👀</div>';
}
function closeYtSearchOverlay(){
  const ov = document.getElementById('ytSearchOverlay');
  if(ov) ov.classList.remove('open');
}
function decodeHtmlEntities(str){
  const ta = document.createElement('textarea');
  ta.innerHTML = str || '';
  return ta.value;
}
async function performYtSearch(){
  const input = document.getElementById('ytSearchInput');
  const grid = document.getElementById('ytResultsGrid');
  if(!input || !grid) return;
  const q = input.value.trim();
  if(!q) return;
  grid.innerHTML = '<div class="yt-search-state">جاري البحث... ⏳</div>';
  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(q)}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error){
      grid.innerHTML = `<div class="yt-search-state">حدث خطأ أثناء البحث: ${escapeHtml(data.error.message || 'غير معروف')}</div>`;
      return;
    }
    const items = Array.isArray(data.items) ? data.items : [];
    if(items.length === 0){
      grid.innerHTML = '<div class="yt-search-state">لم نجد نتائج، جرّب كلمة أخرى 🔍</div>';
      return;
    }
    grid.innerHTML = items.map(it => {
      const vid = it.id && it.id.videoId;
      if(!vid) return '';
      const title = decodeHtmlEntities(it.snippet.title || '');
      const channel = decodeHtmlEntities(it.snippet.channelTitle || '');
      const thumb = (it.snippet.thumbnails && (it.snippet.thumbnails.medium || it.snippet.thumbnails.default) || {}).url || '';
      return `<div class="yt-result-card" data-vid="${escapeHtml(vid)}" data-title="${escapeHtml(title)}" data-thumb="${escapeHtml(thumb)}">
        <img src="${escapeHtml(thumb)}" alt="">
        <div class="yt-result-info">
          <div class="yt-result-title">${escapeHtml(title)}</div>
          <div class="yt-result-channel">${escapeHtml(channel)}</div>
        </div>
      </div>`;
    }).join('');
    grid.querySelectorAll('.yt-result-card').forEach(card => {
      card.onclick = () => {
        ytPendingSelection = {
          videoId: card.getAttribute('data-vid'),
          title: card.getAttribute('data-title'),
          thumb: card.getAttribute('data-thumb')
        };
        openYtConfirmOverlay();
      };
    });
  }catch(e){
    grid.innerHTML = '<div class="yt-search-state">تعذّر الوصول إلى خدمة البحث — تأكد من اتصال الإنترنت وحاول مرة أخرى</div>';
  }
}
function openYtConfirmOverlay(){
  if(!ytPendingSelection) return;
  const thumbEl = document.getElementById('ytConfirmThumb');
  const titleEl = document.getElementById('ytConfirmTitle');
  if(thumbEl) thumbEl.src = ytPendingSelection.thumb || '';
  if(titleEl) titleEl.textContent = ytPendingSelection.title || '';
  const ov = document.getElementById('ytConfirmOverlay');
  if(ov) ov.classList.add('open');
}
function closeYtConfirmOverlay(){
  const ov = document.getElementById('ytConfirmOverlay');
  if(ov) ov.classList.remove('open');
  ytPendingSelection = null;
}
async function confirmYtSelectionYes(){
  if(!ytPendingSelection) return;
  const sel = ytPendingSelection;
  closeYtConfirmOverlay();
  closeYtSearchOverlay();
  await loadVideoById(sel.videoId, {title: sel.title});
}
document.addEventListener('DOMContentLoaded', () => {
  const searchCloseBtn = document.getElementById('ytSearchCloseBtn');
  if(searchCloseBtn) searchCloseBtn.onclick = closeYtSearchOverlay;
  const searchGoBtn = document.getElementById('ytSearchGoBtn');
  if(searchGoBtn) searchGoBtn.onclick = performYtSearch;
  const searchInput = document.getElementById('ytSearchInput');
  if(searchInput) searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') performYtSearch(); });
  const confirmNoBtn = document.getElementById('ytConfirmNoBtn');
  if(confirmNoBtn) confirmNoBtn.onclick = closeYtConfirmOverlay;
  const confirmYesBtn = document.getElementById('ytConfirmYesBtn');
  if(confirmYesBtn) confirmYesBtn.onclick = confirmYtSelectionYes;
});
</script>

function genCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function extractYouTubeId(input){
  if(!input) return null;
  // نظّف النص من الأحرف الخفية والمسافات الزايدة يلي أحيانًا توصل من نسخ التطبيقات
  input = input.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){
    const m = input.match(p);
    if(m) return m[1];
  }
  return null;
}
function extractTikTokId(input){
  if(!input) return null;
  input = input.replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
  if(/^\d{5,25}$/.test(input)) return input; // رقم فيديو تيك توك مباشر
  const m = input.match(/tiktok\.com\/@[\w.\-]+\/video\/(\d+)/);
  if(m) return m[1];
  const m2 = input.match(/tiktok\.com\/.*?\/video\/(\d+)/);
  if(m2) return m2[1];
  return null;
}
function extractDriveFileId(url){
  // يلتقط معرّف الملف من أشكال روابط درايف المختلفة (مشاركة، open؟id=، uc؟id=)
  let m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m && /drive\.google\.com/.test(url)) return m[1];
  return null;
}
function detectGenericEmbed(url){
  // يرجع {kind:'file'} لملفات فيديو مباشرة (يدعم تحكّم/مزامنة كاملة زي يوتيوب)،
  // {kind:'iframe', src} لمنصات معروفة تسمح بالتضمين (بدون تحكم خارجي حقيقي)،
  // أو {kind:'iframe', src:url} كمحاولة عامة (قد يرفضها الموقع لو ما يسمح بالتضمين).
  const driveId = extractDriveFileId(url);
  if(driveId){
    // رابط تشغيل مباشر لملف درايف — يُعامل كـ<video> عادي فيعطي تحكّمًا/مزامنة كاملة بين الأعضاء
    // (يشترط أن يكون الملف مُشارَكًا بصلاحية "أي شخص لديه الرابط"، وقد لا يعمل مع ملفات كبيرة جدًا
    // بسبب صفحة تأكيد "الفحص من الفيروسات" التي يفرضها درايف على الملفات الضخمة)
    return {kind:'file', src:`https://drive.google.com/uc?export=download&id=${driveId}`, isDrive:true};
  }
  if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) return {kind:'file', src:url};
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(vimeo) return {kind:'iframe', src:`https://player.vimeo.com/video/${vimeo[1]}`};
  const dm = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
  if(dm) return {kind:'iframe', src:`https://www.dailymotion.com/embed/video/${dm[1]}`};
  return {kind:'iframe', src:url};
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
}
function ytCommand(iframe, func, args){
  if(!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify({event:'command', func, args: args || []}), '*');
}

/* ============ YouTube player info listener (لتتبع الثانية الحالية للفيديو) ============ */
const lastKnownPlayerInfo = { currentTime: null, playerState: null, duration: null, at: 0, loadedFraction: null, muted: undefined, rate: 1 };
window.addEventListener('message', (ev) => {
  if(!iframeEl || ev.source !== iframeEl.contentWindow) return;
  let data;
  try{ data = JSON.parse(ev.data); }catch(e){ return; }
  if(data && data.event === 'infoDelivery' && data.info){
    if(typeof data.info.currentTime === 'number'){ lastKnownPlayerInfo.currentTime = data.info.currentTime; lastKnownPlayerInfo.at = performance.now(); }
    if(typeof data.info.videoLoadedFraction === 'number') lastKnownPlayerInfo.loadedFraction = data.info.videoLoadedFraction;
    if(typeof data.info.muted === 'boolean') lastKnownPlayerInfo.muted = data.info.muted;
    if(typeof data.info.playbackRate === 'number') lastKnownPlayerInfo.rate = data.info.playbackRate;
    if(typeof data.info.playerState === 'number') lastKnownPlayerInfo.playerState = data.info.playerState;
    if(typeof data.info.duration === 'number' && data.info.duration > 0) lastKnownPlayerInfo.duration = data.info.duration;
  }
});
function fmtSecsShort(s){
  s = Math.max(0, Math.floor(s || 0));
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${sec < 10 ? '0' : ''}${sec}`;
}
/* تحديث دوري لشريط الوقت وأيقونة تشغيل/إيقاف بطبقة التحكم فوق الفيديو (إذا كانت موجودة حاليًا) */
setInterval(() => {
  const fill = document.getElementById('vocProgressFill');
  const label = document.getElementById('vocTimeLabel');
  const playBtn = document.getElementById('vocPlayBtn');
  if(playBtn) playBtn.textContent = lastKnownPlayerInfo.playerState === 1 ? '❚❚' : '▶';
  if(!fill && !label) return;
  const cur = lastKnownPlayerInfo.currentTime || 0;
  const dur = lastKnownPlayerInfo.duration || 0;
  if(fill) fill.style.width = (dur > 0 ? Math.min(100, (cur / dur) * 100) : 0) + '%';
  if(label) label.textContent = `${fmtSecsShort(cur)} / ${dur > 0 ? fmtSecsShort(dur) : '--:--'}`;
}, 500);

/* ============ محرك أصوات النقرات (نغمات مولّدة بالمتصفح — بدون ملفات خارجية) ============ */
let sfxCtx = null;
function getSfxCtx(){
  if(!sfxCtx){
    try{ sfxCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ sfxCtx = null; }
  }
  if(sfxCtx && sfxCtx.state === 'suspended'){ sfxCtx.resume().catch(()=>{}); }
  return sfxCtx;
}
function sfxTone(freq, opts){
  opts = opts || {};
  const duration = opts.duration != null ? opts.duration : 0.09;
  const type = opts.type || 'sine';
  const gainPeak = opts.gain != null ? opts.gain : 0.09;
  const delay = opts.delay || 0;
  const glideTo = opts.glideTo || null;
  const ctx = getSfxCtx();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gainPeak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + duration + 0.03);
  }catch(e){}
}
// أنواع النقرات: boy/girl (نقرات عامة بالتطبيق حسب الجنس المختار)،
// ttt-x / ttt-o (لعبة إكس أو، صوت مختلف لكل علامة)، memory، cups (لكل لعبة صوت خاص فيها)
function playClickSound(kind){
  try{
    switch(kind){
      case 'boy':
        sfxTone(340, {type:'square', duration:.06, gain:.07});
        break;
      case 'girl':
        sfxTone(760, {type:'sine', duration:.08, gain:.06, glideTo:980});
        break;
      case 'ttt-x':
        sfxTone(520, {type:'triangle', duration:.08, gain:.09});
        sfxTone(780, {type:'triangle', duration:.06, gain:.05, delay:.05});
        break;
      case 'ttt-o':
        sfxTone(640, {type:'sine', duration:.12, gain:.08, glideTo:430});
        break;
      case 'memory':
        sfxTone(480, {type:'sine', duration:.06, gain:.08});
        sfxTone(660, {type:'sine', duration:.08, gain:.06, delay:.06});
        break;
      case 'cups':
        sfxTone(230, {type:'square', duration:.05, gain:.09});
        sfxTone(180, {type:'square', duration:.07, gain:.06, delay:.04});
        break;
      case 'draw-start':
        sfxTone(500, {type:'triangle', duration:.07, gain:.07});
        sfxTone(700, {type:'triangle', duration:.09, gain:.06, delay:.06});
        break;
      case 'draw-win':
        sfxTone(520, {type:'sine', duration:.09, gain:.09});
        sfxTone(660, {type:'sine', duration:.09, gain:.08, delay:.09});
        sfxTone(880, {type:'sine', duration:.14, gain:.07, delay:.18});
        break;
      case 'draw-end':
        sfxTone(320, {type:'sine', duration:.14, gain:.07, glideTo:180});
        break;
      default:
        sfxTone(480, {type:'sine', duration:.05, gain:.05});
    }
  }catch(e){}
}

/* ============ shareable room links ============ */
const ROOM_TTL_MS = 24 * 60 * 60 * 1000; // الغرفة تنتهي بعد 24 ساعة من إنشائها
function isRoomExpired(roomState){
  if(!roomState || !roomState.createdAt) return false;
  return (Date.now() - roomState.createdAt) > ROOM_TTL_MS;
}
function getRoomCodeFromUrl(){
  try{
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('room') || '').trim().toUpperCase();
    return code || null;
  }catch(e){ return null; }
}
const pendingRoomCode = getRoomCodeFromUrl();
let pendingSharedUrl = getSharedUrlFromLocation();

function buildRoomLink(code){
  try{
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('room', code);
    return url.toString();
  }catch(e){
    return window.location.href;
  }
}
function updateUrlForRoom(code){
  try{
    const url = buildRoomLink(code);
    window.history.replaceState({}, '', url);
  }catch(e){ /* بعض البيئات (مثل content://) لا تدعم history API */ }
}
async function copyRoomLink(){
  const link = buildRoomLink(state.roomCode);
  try{
    if(navigator.share){
      await navigator.share({ title: 'مشمش', text: 'تعال شاهد معي على مشمش 🍿', url: link });
      return;
    }
  }catch(e){ /* المستخدم ألغى المشاركة أو غير مدعومة، جرب النسخ */ }
  try{
    await navigator.clipboard.writeText(link);
    state.statusMsg = 'تم نسخ رابط الغرفة ✅ شاركه مع أصدقائك';
  }catch(e){
    state.statusMsg = 'تعذر نسخ الرابط تلقائيًا، انسخه يدويًا: ' + link;
  }
  const statusEl = document.getElementById('statusLine');
  if(statusEl) statusEl.textContent = state.statusMsg;
}

/* ============ storage-backed room ops (Firebase Realtime Database) ============ */
const FIREBASE_DB_URL = 'https://mshmsh-d6437-default-rtdb.firebaseio.com';

async function fbGet(path){
  try{
    // مهم جدًا: نمنع أي تخزين مؤقت (متصفح أو Service Worker) لطلبات القراءة،
    // وإلا كل عضو ممكن يضل يشوف "لقطة" قديمة من الغرفة عنده فقط ولا توصله
    // أي تحديثات من باقي الأعضاء (نفس أعراض: "بس أنا بالغرفة" عند الكل).
    // إضافة طابع زمني فريد بالرابط يجبر أي طبقة تخزين مؤقت تتجاوزه وتطلب نسخة جديدة فعليًا.
    const bustedUrl = FIREBASE_DB_URL + '/' + path + '.json?_=' + Date.now() + Math.random().toString(36).slice(2);
    const res = await fetch(bustedUrl, { cache: 'no-store' });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function fbSet(path, value){
  try{
    await fetch(FIREBASE_DB_URL + '/' + path + '.json', {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      cache: 'no-store',
      body: JSON.stringify(value)
    });
  }catch(e){}
}
async function fbDelete(path){
  try{
    await fetch(FIREBASE_DB_URL + '/' + path + '.json', { method: 'DELETE', cache: 'no-store' });
  }catch(e){}
}

async function getRoomState(code){
  const data = await fbGet('rooms/'+code+'/state');
  return data || null;
}
async function setRoomState(code, data){
  await fbSet('rooms/'+code+'/state', data);
}
async function getRoomChat(code){
  const data = await fbGet('rooms/'+code+'/chat');
  return Array.isArray(data) ? data : [];
}
async function pushChatMessage(code, msg){
  const list = await getRoomChat(code);
  list.push(msg);
  pruneChatBySize(list);
  await fbSet('rooms/'+code+'/chat', list);
}
function pruneChatBySize(list){
  const MAX_BYTES = 4 * 1024 * 1024; // هامش أمان تحت حد الـ5MB
  while(list.length > 1 && new TextEncoder().encode(JSON.stringify(list)).length > MAX_BYTES){
    list.shift();
  }
  while(list.length > 150) list.shift();
}
async function getRoomUsers(code){
  const data = await fbGet('rooms/'+code+'/users');
  return (data && typeof data === 'object') ? data : {};
}
async function touchPresence(code, name){
  const users = await getRoomUsers(code);
  users[name] = Date.now();
  // drop stale (>30s)
  for(const k in users){ if(Date.now() - users[k] > 30000) delete users[k]; }
  await fbSet('rooms/'+code+'/users', users);
  return users;
}

async function createRoom(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ showError('اكتب اسمك الأول'); return; }
  const btn = document.getElementById('createBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جاري الإنشاء...'; }
  try{
    await saveMyName(name);
    state.myName = name;
    state.roomCode = genCode();
    state.roomCreatedBy = name;
    await setRoomState(state.roomCode, {videoId:null, platform:'youtube', mediaId:null, queue:[], queueIndex:-1, isPlaying:false, updatedAt:0, updatedBy:name, seekTo:null, createdAt:Date.now(), createdBy:name, leaderTime:null});
    try{
      await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: name + ' أنشأ الغرفة 🎬', ts:Date.now()});
    }catch(e){ /* رسالة النظام مش ضرورية لدخول الغرفة */ }
    enterRoom();
  }catch(e){
    showError('حدث خطأ ولم نتمكن من إنشاء الغرفة، حاول مرة أخرى');
    if(btn){ btn.disabled = false; btn.textContent = 'إنشاء غرفة جديدة'; }
  }
}
async function joinRoom(){
  const name = document.getElementById('nameInput').value.trim();
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if(!name){ showError('اكتب اسمك الأول'); return; }
  if(!code){ showError('اكتب كود الغرفة'); return; }
  const btn = document.getElementById('joinBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جاري الانضمام...'; }
  try{
    const existing = await getRoomState(code);
    if(!existing){ showError('لا توجد غرفة بهذا الكود'); if(btn){btn.disabled=false; btn.textContent='انضمام لغرفة';} return; }
    if(isRoomExpired(existing)){
      showError('انتهت صلاحية هذه الغرفة (مضى عليها أكثر من 24 ساعة) — اطلب من صاحبها إنشاء غرفة جديدة');
      if(btn){ btn.disabled = false; btn.textContent = 'انضمام لغرفة'; }
      return;
    }
    await saveMyName(name);
    state.myName = name;
    state.roomCode = code;
    state.roomCreatedBy = existing.createdBy || null;
    try{
      await pushChatMessage(code, {sys:true, id:genMsgId(), text: name + ' انضم للغرفة 👋', ts:Date.now()});
    }catch(e){ /* رسالة النظام مش ضرورية لدخول الغرفة */ }
    enterRoom();
  }catch(e){
    showError('حدث خطأ ولم نتمكن من الانضمام إلى الغرفة، حاول مرة أخرى');
    if(btn){ btn.disabled = false; btn.textContent = 'انضمام لغرفة'; }
  }
}

function enterRoom(){
  state.screen = 'room';
  state.errorMsg = '';
  updateUrlForRoom(state.roomCode);
  try{ localStorage.setItem('mshmsh-last-room', JSON.stringify({code: state.roomCode, name: state.myName})); }catch(e){}
  render();
  startPolling();
  startLeaderSync();
  // إذا دخلنا الغرفة عن طريق مشاركة فيديو من تطبيق ثاني، وأنا القائد، شغّله فورًا بدون أي ضغط إضافي
  if(pendingSharedUrl && isLeaderNow()){
    const url = pendingSharedUrl;
    pendingSharedUrl = null;
    const p = extractYouTubeId(url) ? 'youtube' : extractTikTokId(url) ? 'tiktok' : 'generic';
    loadMedia(p, url, {});
  }
}

function handleRoomExpired(){
  const code = state.roomCode;
  leaveRoom();
  state.errorMsg = 'انتهت صلاحية الغرفة (مضى عليها أكثر من 24 ساعة) وأُغلقت تلقائيًا';
  render();
  // تنظيف تخزين الغرفة المنتهية (best-effort)
  try{
    fbDelete('rooms/'+code+'/state');
    fbDelete('rooms/'+code+'/chat');
    fbDelete('rooms/'+code+'/users');
  }catch(e){}
}
// صاحب التاج فقط: يغلق الغرفة نهائيًا لكل الأعضاء ويمسح كل الروابط/القائمة العشوائية،
// حتى لو رجع نفس الكود ما يلقى فيديوهات قديمة — كل جلسة جديدة تبدأ فاضية 100%
async function closeRoomForEveryone(){
  if(!isLeaderNow() || !state.roomCode) { leaveRoom(); return; }
  const ok = confirm('سيؤدي هذا إلى إغلاق الغرفة لجميع الأعضاء ومسح قائمة الفيديوهات نهائيًا. هل تريد المتابعة؟');
  if(!ok) return;
  const code = state.roomCode;
  try{
    await fbDelete('rooms/'+code+'/state');
    await fbDelete('rooms/'+code+'/chat');
    await fbDelete('rooms/'+code+'/users');
    await fbDelete('rooms/'+code+'/game');
    await fbDelete('rooms/'+code+'/suggestions');
    await fbDelete('rooms/'+code+'/ready');
    await fbDelete('rooms/'+code+'/clock');
  }catch(e){ /* حذف بأفضل جهد، ما نوقف الخروج بسببه */ }
  leaveRoom();
}
function leaveRoom(){
  stopPolling();
  stopLeaderSync();
  try{ localStorage.removeItem('mshmsh-last-room'); }catch(e){}
  state.screen = 'landing';
  state.roomCode = '';
  state.roomCreatedBy = null;
  state.videoId = null;
  state.mediaId = null;
  state.platform = 'youtube';

function buildMemoryBoard(){
  const pairs = [...MEMORY_SYMBOLS, ...MEMORY_SYMBOLS];
  for(let i = pairs.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  return pairs.map(symbol => ({ symbol }));
}
function buildInitialGameState(type){
  // ملاحظة مهمة: نستخدم '' (نص فاضي) بدل null للخانات/اللاعبين الفارغين.
  // السبب: Firebase Realtime Database تحذف تلقائيًا أي قيمة null، وأي مصفوفة/كائن
  // كل عناصره null يُحذف بالكامل من القاعدة عند الحفظ — وهذا كان يكسر اللوحة عند الأعضاء
  // (يجيبونها فاضية/مفقودة من السيرفر). '' قيمة فاضية منطقيًا (falsy) بنفس معنى null
  // بكل أكواد اللعبة، لكنها تُحفظ فعليًا بقاعدة البيانات ولا تُحذف.
  if(type === 'tictactoe'){
    return { type:'tictactoe', id:genMsgId(), board:Array(9).fill(''), turn:'X', players:{X:'',O:''}, winner:'', updatedAt:Date.now(), updatedBy:state.myName };
  }
  if(type === 'memory'){
    return { type:'memory', id:genMsgId(), board:buildMemoryBoard(), matchedBy:Array(30).fill(''), flipped:[], turn:'A', players:{A:'',B:''}, scores:{A:0,B:0}, winner:'', updatedAt:Date.now(), updatedBy:state.myName };
  }
  if(type === 'cups'){
    return { type:'cups', id:genMsgId(), players:{A:'',B:''}, turn:'A', phase:'idle', ballPos:-1, guess:-1, correct:false, scores:{A:0,B:0}, round:1, shuffleStart:0, updatedAt:Date.now(), updatedBy:state.myName };
  }
  if(type === 'draw'){
    return { type:'draw', id:genMsgId(), phase:'select', drawer:'', word:'', wordOptions:[], usedWords:[], strokes:[], startTs:0, durationMs:DRAW_DURATION_MS, result:'', lastGuesser:'', scores:{}, round:1, updatedAt:Date.now(), updatedBy:state.myName };
  }
  return null;
}

// يصلح أي حالة لعبة راجعة من Firebase: يرجّع الحقول المفقودة (بسبب حذف null التلقائي)
// لقيمها الافتراضية الصحيحة، حتى لو كانت البيانات المخزّنة قديمة/تالفة من قبل هذا الإصلاح.
function normalizeGameState(g){
  if(!g || !g.type) return null;
  const out = {...g};
  if(out.type === 'tictactoe'){
    out.board = (Array.isArray(out.board) && out.board.length === 9) ? out.board.map(v => v || '') : Array(9).fill('');
    const p = (out.players && typeof out.players === 'object') ? out.players : {};
    out.players = { X: p.X || '', O: p.O || '' };
    out.winner = out.winner || null;
  } else if(out.type === 'memory'){
    out.board = Array.isArray(out.board) ? out.board : [];
    out.matchedBy = (Array.isArray(out.matchedBy) && out.matchedBy.length === 30) ? out.matchedBy.map(v => v || '') : Array(30).fill('');
    out.flipped = Array.isArray(out.flipped) ? out.flipped : [];
    const p = (out.players && typeof out.players === 'object') ? out.players : {};
    out.players = { A: p.A || '', B: p.B || '' };
    out.scores = (out.scores && typeof out.scores === 'object') ? out.scores : {A:0,B:0};
    out.winner = out.winner || null;
  } else if(out.type === 'cups'){
    const p = (out.players && typeof out.players === 'object') ? out.players : {};
    out.players = { A: p.A || '', B: p.B || '' };
    out.scores = (out.scores && typeof out.scores === 'object') ? out.scores : {A:0,B:0};
    out.phase = out.phase || 'idle';
    out.ballPos = (typeof out.ballPos === 'number') ? out.ballPos : -1;
    out.guess = (typeof out.guess === 'number') ? out.guess : -1;
  } else if(out.type === 'draw'){
    out.phase = out.phase || 'select';
    out.drawer = out.drawer || '';
    out.word = out.word || '';
    out.wordOptions = Array.isArray(out.wordOptions) ? out.wordOptions : [];
    out.usedWords = Array.isArray(out.usedWords) ? out.usedWords : [];
    out.strokes = Array.isArray(out.strokes) ? out.strokes : [];
    out.startTs = out.startTs || 0;
    out.durationMs = out.durationMs || DRAW_DURATION_MS;
    out.result = out.result || '';
    out.lastGuesser = out.lastGuesser || '';
    out.scores = (out.scores && typeof out.scores === 'object') ? out.scores : {};
    out.round = out.round || 1;
  }
  return out;
}

/* ---------- منطق إكس أو ---------- */
function checkTTTWinner(board){
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const [a,b,c] of lines){
    if(board[a] && board[a]===board[b] && board[a]===board[c]) return board[a];
  }
  return board.every(c => c) ? 'draw' : null;
}
async function claimSymbol(sym){
  const g = state.game;
  if(!g || !g.players || !(sym in g.players)) return;
  const other = Object.keys(g.players).find(k => k !== sym);
  if(other && g.players[other] === state.myName){ setStatus('أنت بالفعل تلعب بالطرف الآخر في هذه الجولة'); return; }
  if(g.players[sym] && g.players[sym] !== state.myName){ setStatus('هذا المكان محجوز لعضو آخر'); return; }
  const updated = {...g, players:{...g.players, [sym]: state.myName}, updatedAt:Date.now(), updatedBy:state.myName};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){ setStatus('تعذر حجز المكان، حاول مرة أخرى', true); }
}
async function releaseSymbol(sym){
  const g = state.game;
  if(!g || g.players[sym] !== state.myName) return;
  const updated = {...g, players:{...g.players, [sym]: ''}, updatedAt:Date.now(), updatedBy:state.myName};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){}
}
async function playCell(idx){
  const g = state.game;
  if(!g || g.type !== 'tictactoe' || g.winner) return;
  if(g.players[g.turn] !== state.myName) return; // مو دورك
  if(g.board[idx]) return;
  playClickSound(g.turn === 'X' ? 'ttt-x' : 'ttt-o');
  const board = g.board.slice();
  board[idx] = g.turn;
  const winner = checkTTTWinner(board);
  const updated = {...g, board, winner, turn: winner ? g.turn : (g.turn==='X'?'O':'X'), updatedAt:Date.now(), updatedBy:state.myName};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){ setStatus('تعذر حفظ حركتك، حاول مرة أخرى', true); }
}
async function resetGame(){
  const g = state.game;
  if(!g) return;
  let updated;
  if(g.type === 'tictactoe'){
    updated = {...g, id:genMsgId(), board:Array(9).fill(''), winner:'', turn:'X', updatedAt:Date.now(), updatedBy:state.myName};
  } else if(g.type === 'memory'){
    updated = {...g, id:genMsgId(), board:buildMemoryBoard(), matchedBy:Array(30).fill(''), flipped:[], turn:'A', scores:{A:0,B:0}, winner:'', updatedAt:Date.now(), updatedBy:state.myName};
  } else if(g.type === 'cups'){
    updated = {...g, id:genMsgId(), turn:'A', phase:'idle', ballPos:-1, guess:-1, correct:false, scores:{A:0,B:0}, round:1, shuffleStart:0, updatedAt:Date.now(), updatedBy:state.myName};
  } else if(g.type === 'draw'){
    if(!isLeaderNow()){ setStatus('فقط قائد الغرفة يقدر يبدأ لعبة رسم جديدة 🔒', true); return; }

    updated = {...g, id:genMsgId(), phase:'select', drawer:'', word:'', wordOptions:[], usedWords:[], strokes:[], startTs:0, result:'', lastGuesser:'', scores:{}, round:1, updatedAt:Date.now(), updatedBy:state.myName};

/* ---------- منطق لعبة الذاكرة (تقليب الصور) ---------- */
async function flipCard(idx){
  const g = state.game;
  if(!g || g.type !== 'memory' || g.winner) return;
  if(g.players[g.turn] !== state.myName) return; // مو دورك
  if(g.matchedBy[idx] || g.flipped.includes(idx) || g.flipped.length >= 2) return;
  playClickSound('memory');
  const flipped = [...g.flipped, idx];
  if(flipped.length < 2){
    const updated = {...g, flipped, updatedAt:Date.now(), updatedBy:state.myName};
    state.game = updated;
    renderGameOnly();
    try{ await setGameState(state.roomCode, updated); }catch(e){}
    return;
  }
  // ثاني بطاقة: نظهرها للطرفين فورًا، وبعد لحظة بسيطة نحسم التطابق
  const shown = {...g, flipped, updatedAt:Date.now(), updatedBy:state.myName};
  state.game = shown;
  renderGameOnly();
  try{ await setGameState(state.roomCode, shown); }catch(e){}
  clearTimeout(memoryResolveTimer);
  memoryResolveTimer = setTimeout(async () => {
    const cur = state.game;
    if(!cur || cur.type !== 'memory') return;
    const [i, j] = flipped;
    const isMatch = cur.board[i] && cur.board[j] && cur.board[i].symbol === cur.board[j].symbol;
    const matchedBy = cur.matchedBy.slice();
    const scores = {...cur.scores};
    let turn = cur.turn;
    if(isMatch){
      matchedBy[i] = cur.turn;
      matchedBy[j] = cur.turn;
      scores[cur.turn] = (scores[cur.turn] || 0) + 1;
    } else {
      turn = cur.turn === 'A' ? 'B' : 'A';
    }
    const allMatched = matchedBy.every(v => v);
    let winner = null;
    if(allMatched){
      winner = scores.A === scores.B ? 'draw' : (scores.A > scores.B ? 'A' : 'B');
    }
    const resolved = {...cur, matchedBy, flipped:[], scores, turn, winner, updatedAt:Date.now(), updatedBy:state.myName};
    state.game = resolved;
    renderGameOnly();
    try{ await setGameState(state.roomCode, resolved); }catch(e){}
  }, 900);
}

async function hideBall(){
  const g = state.game;
  if(!g || g.type !== 'cups') return;
  if(g.players[g.turn] !== state.myName) return; // مو دور المخفي
  if(g.phase !== 'idle') return;
  playClickSound('cups');
  const ballPos = Math.floor(Math.random() * 3);
  const updated = {...g, phase:'shuffling', ballPos, guess:-1, correct:false, shuffleStart:Date.now(), updatedAt:Date.now(), updatedBy:state.myName};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){}
}
async function guessCup(idx){
  const g = state.game;
  if(!g || g.type !== 'cups' || g.phase !== 'shuffling') return;
  const guesserKey = g.turn === 'A' ? 'B' : 'A';
  if(g.players[guesserKey] !== state.myName) return;
  if(Date.now() - g.shuffleStart < CUPS_SHUFFLE_MS) return; // لسه يخلط
  playClickSound('cups');
  const correct = idx === g.ballPos;
  const scores = {...g.scores};
  if(correct) scores[guesserKey] = (scores[guesserKey] || 0) + 1;
  const updated = {...g, phase:'revealed', guess:idx, correct, scores, updatedAt:Date.now(), updatedBy:state.myName};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){}
}
async function nextCupsRound(){
  const g = state.game;
  if(!g || g.type !== 'cups') return;
  const updated = {...g, turn: g.turn === 'A' ? 'B' : 'A', phase:'idle', ballPos:-1, guess:-1, correct:false, round:(g.round||1)+1, updatedAt:Date.now(), updatedBy:state.myName};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){}
}

/* ---------- منطق لعبة الرسم والتخمين ---------- */
function pickWordOptions(used){
  const usedSet = new Set(used || []);
  let pool = WORD_BANK.filter(w => !usedSet.has(w));
  if(pool.length < 3) pool = WORD_BANK.slice(); // استنفدنا كل الكلمات، نبدأ الدورة من جديد
  const shuffled = pool.slice();
  for(let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, 3);
}
function maskedWord(word){
  return (word || '').split('').map(ch => ch === ' ' ? '  ' : '_').join(' ');
}
function normalizeGuessText(s){
  return (s || '').trim()
    .replace(/[\u064B-\u065F\u0670]/g, '') // إزالة التشكيل
    .replace(/[إأآا]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/[ىي]/g, 'ي')
    .replace(/\s+/g, '')
    .toLowerCase();
}
async function nominateDrawer(name){
  const g = state.game;
  if(!g || g.type !== 'draw' || g.phase !== 'select' || !name) return;
  const options = pickWordOptions(g.usedWords);
  const updated = {...g, drawer:name, wordOptions:options, updatedAt:Date.now(), updatedBy:state.myName, phase:'choosing'};
  state.game = updated;
  renderGameOnly();
  try{ await setGameState(state.roomCode, updated); }catch(e){}
}
async function chooseWord(word){
  const g = state.game;
  if(!g || g.type !== 'draw' || g.phase !== 'choosing' || g.drawer !== state.myName) return;
  if(!Array.isArray(g.wordOptions) || !g.wordOptions.includes(word)) return;
  playClickSound('draw-start');
  drawLocalStrokes = [];

  const scaleX = el.width / rect.width;

  ctx.fillRect(0, 0, el.width, el.height);
  (strokes || []).forEach(s => {
    if(!s.points || !s.points.length) return;
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if(s.points.length === 1){
      ctx.beginPath();
      ctx.arc(s.points[0][0], s.points[0][1], s.size / 2, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();

    }
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);

  const stillShuffling = g.phase === 'shuffling' && elapsed < CUPS_SHUFFLE_MS;

  let statusText;
  if(!g.players.A || !g.players.B) statusText = 'بانتظار انضمام لاعب آخر 🙋';
  else if(g.phase === 'idle') statusText = iAmHider ? 'اخفِ الكرة تحت أي كوب وابدأ الخلط 🙈' : (escapeHtml(g.players[hiderKey]) + ' يخبئ الكرة الآن...');
  else if(stillShuffling) statusText = 'جاري الخلط... ركّز 👀';
  else if(g.phase === 'shuffling') statusText = iAmGuesser ? 'أين الكرة؟ اختر كوبًا 🤔' : (escapeHtml(g.players[guesserKey]) + ' يخمّن الآن...');
  else if(g.phase === 'revealed') statusText = g.correct ? (escapeHtml(g.players[guesserKey]) + ' وجدها! 🎉') : (escapeHtml(g.players[guesserKey]) + ' لم يجدها 😅');
  else statusText = '';

  const cupsHtml = [0,1,2].map(i => {
    const clickable = g.phase === 'shuffling' && !stillShuffling && iAmGuesser;
    const shaking = stillShuffling ? 'shaking' : '';
    let content = '🥤';
    if(g.phase === 'revealed' && i === g.ballPos) content = '🥤<span class="cup-ball">🔴</span>';
    return `<button class="cup-item ${shaking}" data-cup="${i}" ${clickable?'':'disabled'}>${content}</button>`;
  }).join('');

  const aPlayerHtml = g.players.A
    ? `${escapeHtml(g.players.A)}${g.players.A===state.myName ? ' <span class="release-link" data-release="A">ترك</span>' : ''} (${g.scores.A||0})`
    : `<button class="mini-btn" data-claim="A">إلعب 🥇</button>`;
  const bPlayerHtml = g.players.B
    ? `${escapeHtml(g.players.B)}${g.players.B===state.myName ? ' <span class="release-link" data-release="B">ترك</span>' : ''} (${g.scores.B||0})`
    : `<button class="mini-btn" data-claim="B">إلعب 🥈</button>`;

  const hideBtn = (g.phase === 'idle' && iAmHider) ? `<button class="mini-btn cup-action-btn" id="cupsHideBtn">🙈 اخفِ الكرة</button>` : '';
  const nextBtn = (g.phase === 'revealed') ? `<button class="mini-btn cup-action-btn" id="cupsNextBtn">الجولة التالية ▶</button>` : '';

  return `
    <div class="game-panel">
      <div class="game-panel-head">
        <span>🥤 لعبة الأكواب</span>
        <div class="game-panel-actions">
          <button class="mini-btn" id="gameResetBtn">لعبة جديدة</button>
          <button class="mini-btn" id="gameCloseBtn">إغلاق</button>
        </div>
      </div>
      <div class="ttt-status">${statusText}</div>
      <div class="cups-row">${cupsHtml}</div>
      ${hideBtn}${nextBtn}
      <div class="ttt-players">
        <div class="ttt-player ${g.players.A===state.myName?'mine':''}">🥇 ${aPlayerHtml} ${hiderKey==='A'?'🙈':'🤔'}</div>
        <div class="ttt-player ${g.players.B===state.myName?'mine':''}">🥈 ${bPlayerHtml} ${hiderKey==='B'?'🙈':'🤔'}</div>
      </div>
    </div>`;
}
/* ============ عرض لوحة المقترحات + التصويت ============ */
function suggestionsPanelMarkup(){
  const s = state.suggestions;
  if(!s || !Array.isArray(s.items) || s.items.length === 0) return '';
  const leader = isLeaderNow();
  const votes = s.votes || {};
  const tally = {};
  Object.values(votes).forEach(vid => { tally[vid] = (tally[vid] || 0) + 1; });
  const myVote = votes[state.myName] || null;
  const cardsHtml = s.items.map(it => {
    const count = tally[it.videoId] || 0;
    const mine = myVote === it.videoId;
    return `<button class="sugg-card ${mine ? 'voted' : ''}" data-suggest="${escapeHtml(it.videoId)}" title="${escapeHtml(it.title || '')}">
      <img src="${it.thumb}" alt="" loading="lazy">
      <span class="sugg-title">${escapeHtml((it.title || 'فيديو مقترح').slice(0, 46))}</span>
      ${count > 0 ? `<span class="sugg-votes">🗳️ ${count}</span>` : ''}
    </button>`;
  }).join('');
  return `
    <div class="suggestions-panel">
      <div class="suggestions-head">🎬 ${leader ? 'انتهى الفيديو — اختر التالي' : 'انتهى الفيديو — صوّت للفيديو التالي'}</div>
      <div class="suggestions-row">${cardsHtml}</div>
    </div>`;
}

// أيقونة صغيرة خاصة بالقائد فقط: تفتح/تسكّر لوحة صغيرة توضح نتيجة التصويت، وتشغّل الفيديو الأعلى تصويتًا بضغطة

function closeVotesMenu(){

function renderVotesMenu(){

async function loadMedia(platform, raw, opts){
  opts = opts || {};
  if(!isLeaderNow()){ setStatus('اختيار الفيديو متاح فقط لمنشئ الغرفة 🔒', true); return; }
  let videoId = null, mediaId = null;
  if(platform === 'youtube'){
    videoId = (raw && /^[a-zA-Z0-9_-]{11}$/.test(raw)) ? raw : extractYouTubeId(raw);
    if(!videoId){ setStatus('تعذر التعرف على الفيديو من هذا الرابط — تأكد أنه رابط يوتيوب صحيح (youtube.com أو youtu.be)', true); return; }
  } else if(platform === 'tiktok'){
    mediaId = extractTikTokId(raw);
    if(!mediaId){ setStatus('تعذر التعرف على فيديو تيك توك — الصق رابطًا كاملًا بصيغة tiktok.com/@user/video/1234567890', true); return; }
  } else { // generic
    const url = (raw || '').trim();
    if(!/^https?:\/\//i.test(url)){ setStatus('الصق رابط صحيح يبدأ بـ http:// أو https://', true); return; }
    mediaId = url;
  }
  const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  const queue = Array.isArray(cur.queue) ? cur.queue.slice() : [];
  queue.push({platform, videoId, mediaId, title: opts.title || ''});
  const queueIndex = queue.length - 1;
  const data = {platform, videoId, mediaId, queue, queueIndex, randomMode:false, ...freshLoadFields(platform, mediaId), updatedBy:state.myName};
  const merged = {...cur, ...data};
  setStatus('');
  lastKnownPlayerInfo.currentTime = null;
  lastKnownPlayerInfo.playerState = null;
  pushRoomState(merged); // ينطبق فورًا محليًا، ويرسل بالخلفية
  try{
    const label = platform === 'youtube' ? 'يوتيوب' : platform === 'tiktok' ? 'تيك توك' : 'رابط عام';
    await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: state.myName + (opts.title ? (' شغّل: ' + opts.title + ` (${label}) 🍿`) : ` شغّل فيديو جديد (${label}) 🍿`), ts:Date.now()});
  }catch(e){ /* رسالة النظام مش ضرورية */ }
}
