async function goToQueueIndex(idx){
  if(!isLeaderNow()) return;
  let cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  // بوضع التقليب العشوائي: لو قربنا نخلّص القائمة، نجيب دفعة جديدة قبل ما نتنقل (تقليب بلا نهاية)
  if(cur.randomMode && idx >= 0){
    cur = await topUpRandomQueueIfNeeded({...cur, queueIndex: idx}) || cur;
  }
  const queue = Array.isArray(cur.queue) ? cur.queue : [];
  if(idx < 0 || idx >= queue.length) return;
  const item = queue[idx];
  const data = {
    platform:item.platform, videoId:item.videoId||null, mediaId:item.mediaId||null,
    queueIndex: idx, ...freshLoadFields(item.platform, item.mediaId||null), updatedBy:state.myName
  };
  const merged = {...cur, ...data};
  setStatus('');
  lastKnownPlayerInfo.currentTime = null;
  lastKnownPlayerInfo.playerState = null;
  pushRoomState(merged);
}
function nextInQueue(){ goToQueueIndex((typeof state.queueIndex === 'number' ? state.queueIndex : -1) + 1); }
function prevInQueue(){ goToQueueIndex((typeof state.queueIndex === 'number' ? state.queueIndex : 0) - 1); }

/* ============ تقليب عشوائي تلقائي (يوتيوب Shorts) ============ */
// كلمات بحث متنوعة تُستخدم عشوائيًا لجلب فيديوهات قصيرة متنوعة — تقدر تضيف/تعدّل هذي القائمة براحتك
const RANDOM_SHORTS_TOPICS = [
  '#shorts', 'shorts ترند', 'فيديوهات مضحكة', 'تحدي شورتس', 'funny shorts',
  'شورتس طبخ', 'شورتس رياضة', 'شورتس سفر', 'satisfying shorts', 'fails shorts',
  'شورتس حيوانات', 'شورتس موسيقى', 'life hacks shorts', 'شورتس كوميدي',
  'gaming shorts', 'شورتس تقنية', 'dance shorts', 'شورتس رعب قصير'
];
function pickRandomTopic(){
  return RANDOM_SHORTS_TOPICS[Math.floor(Math.random() * RANDOM_SHORTS_TOPICS.length)];
}
function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// يجيب دفعة فيديوهات Shorts عشوائية عبر YouTube Data API (رسمي وقانوني)
async function fetchRandomShortsBatch(count){
  count = count || 10;
  const q = pickRandomTopic();
  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=short&maxResults=${Math.min(count*2, 50)}&q=${encodeURIComponent(q)}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error || !Array.isArray(data.items)) return [];
    const items = data.items
      .map(it => ({ videoId: it.id && it.id.videoId, title: decodeHtmlEntities((it.snippet && it.snippet.title) || '') }))
      .filter(it => it.videoId);
    return shuffleArr(items).slice(0, count).map(it => ({ platform:'youtube', videoId: it.videoId, mediaId:null, title: it.title }));
  }catch(e){
    return [];
  }
}
// يجيب عنوان فيديو يوتيوب من رقمه (نستخدمه لما ما يكون عندنا عنوان محفوظ بالطابور، مثلاً لو لُصق رابط يدويًا)
async function fetchVideoTitle(videoId){
  try{
    const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const item = data.items && data.items[0];
    return item ? decodeHtmlEntities((item.snippet && item.snippet.title) || '') : '';
  }catch(e){ return ''; }
}
// مقترحات "شبيهة" بالفيديو الحالي: نبحث بعنوانه (يوتيوب أوقف خاصية "فيديوهات مرتبطة" الرسمية بالـ API العام،
// فهذا أقرب بديل متاح رسميًا وقانونيًا عبر YouTube Data API)
async function fetchRelatedVideosFor(videoTitle, excludeId, count){
  count = count || 8;
  const q = (videoTitle || '').trim() || pickRandomTopic();
  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=${Math.min(count+4, 25)}&q=${encodeURIComponent(q)}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error || !Array.isArray(data.items)) return [];
    return data.items
      .map(it => ({ videoId: it.id && it.id.videoId, title: decodeHtmlEntities((it.snippet && it.snippet.title) || '') }))
      .filter(it => it.videoId && it.videoId !== excludeId)
      .slice(0, count)
      .map(it => ({ ...it, thumb: `https://i.ytimg.com/vi/${it.videoId}/mqdefault.jpg` }));
  }catch(e){ return []; }
}
let randomShuffleBusy = false;
// القائد فقط: يبني قائمة عشوائية جديدة من الصفر ويبدأ التشغيل — بدون أي لصق روابط
async function startRandomShuffle(){
  if(!isLeaderNow() || randomShuffleBusy) return;
  randomShuffleBusy = true;
  setStatus('جاري تجهيز فيديوهات عشوائية... 🎲');
  try{
    const batch = await fetchRandomShortsBatch(12);
    if(batch.length === 0){
      setStatus('تعذر جلب فيديوهات الآن — حاول مرة أخرى بعد قليل', true);
      return;
    }
    const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
    const data = {
      platform: batch[0].platform, videoId: batch[0].videoId, mediaId: null,
      queue: batch, queueIndex: 0, randomMode: true,
      ...freshLoadFields(batch[0].platform, null), updatedBy: state.myName
    };
    const merged = {...cur, ...data};
    try{ await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: state.myName + ' بدأ تقليب عشوائي 🎲🎬', ts:Date.now()}); }catch(e){}
    setStatus('');
    lastKnownPlayerInfo.currentTime = null;
    lastKnownPlayerInfo.playerState = null;
    pushRoomState(merged);
  } finally {
    randomShuffleBusy = false;
  }
}
// لما نقترب من آخر القائمة بوضع العشوائي، نجيب دفعة جديدة ونلحقها بالقائمة تلقائيًا (تقليب بلا نهاية)
async function topUpRandomQueueIfNeeded(cur){
  if(!cur || !cur.randomMode) return cur;
  const queue = Array.isArray(cur.queue) ? cur.queue : [];
  const idx = typeof cur.queueIndex === 'number' ? cur.queueIndex : -1;
  if(queue.length - idx > 3) return cur; // لسه فيه فيديوهات كافية بالقائمة
  const more = await fetchRandomShortsBatch(8);
  if(more.length === 0) return cur;
  const newQueue = queue.concat(more);
  const merged = {...cur, queue:newQueue};
  await setRoomState(state.roomCode, merged);
  return merged;
}
function setUiPlatform(p){
  uiActivePlatform = p;
  renderLeaderControlsOnly();
}

/* ============ مقترحات نهاية الفيديو: يبنيها القائد فقط، يشوفها الجميع ============ */
let suggestionsBusy = false;
let lastSuggestionsForVideoId = null; // نمنع تكرار توليد نفس المقترحات لنفس الفيديو
// يشتغل عند القائد فقط (من مؤقّت بث المزامنة) لما يكتشف إن الفيديو خلص
async function handleVideoEndedForSuggestions(){
  if(!isLeaderNow() || suggestionsBusy) return;
  if(!state.videoId || state.platform !== 'youtube') return;
  if(lastSuggestionsForVideoId === state.videoId) return;
  suggestionsBusy = true;
  try{
    const existing = await getSuggestionsState(state.roomCode);
    if(existing && existing.forVideoId === state.videoId){ lastSuggestionsForVideoId = state.videoId; return; }
    let title = (state.queue[state.queueIndex] && state.queue[state.queueIndex].title) || '';
    if(!title) title = await fetchVideoTitle(state.videoId);
    const items = await fetchRelatedVideosFor(title, state.videoId, 8);
    if(items.length === 0) return;
    lastSuggestionsForVideoId = state.videoId;
    await setSuggestionsState(state.roomCode, {forVideoId: state.videoId, items, votes:{}, createdAt: Date.now()});
  } finally {
    suggestionsBusy = false;
  }
}
// القائد فقط: يضغط مقترح فيشتغل فورًا للجميع (بنفس طريقة تشغيل أي فيديو جديد)
async function playSuggestedVideo(item){
  if(!isLeaderNow() || !item || !item.videoId) return;
  const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  const queue = Array.isArray(cur.queue) ? cur.queue.slice() : [];
  queue.push({platform:'youtube', videoId:item.videoId, mediaId:null, title: item.title || ''});
  const queueIndex = queue.length - 1;
  const data = {
    platform:'youtube', videoId:item.videoId, mediaId:null, queue, queueIndex, randomMode:false,
    ...freshLoadFields('youtube', null), updatedBy:state.myName
  };
  const merged = {...cur, ...data};
  lastSuggestionsForVideoId = null;
  state.suggestions = null;
  lastKnownPlayerInfo.currentTime = null;
  lastKnownPlayerInfo.playerState = null;
  pushRoomState(merged); // ينطبق فورًا محليًا — يتبدّل الفيديو فورًا بدل ما ينتظر جولة شبكة
  renderSuggestionsOnly();
  clearSuggestionsState(state.roomCode); // بالخلفية، ما ننتظرها
  try{
    await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: state.myName + (item.title ? (' شغّل من المقترحات: ' + item.title + ' 🍿') : ' شغّل فيديو من المقترحات 🍿'), ts:Date.now()});
  }catch(e){}
}
// أي عضو (غير القائد): يضغط مقترح فيصوّت له فقط، ما يشغّله
async function voteSuggestion(videoId){
  if(!state.suggestions || !state.roomCode || !videoId) return;
  const cur = await getSuggestionsState(state.roomCode) || state.suggestions;
  if(cur.forVideoId !== state.videoId) return; // المقترحات صارت قديمة (تغيّر الفيديو)
  const votes = {...(cur.votes || {}), [state.myName]: videoId};
  const updated = {...cur, votes};
  state.suggestions = updated;
  renderSuggestionsOnly();
  await setSuggestionsState(state.roomCode, updated);
}
function onSuggestionClick(item){
  if(isLeaderNow()) playSuggestedVideo(item);
  else voteSuggestion(item.videoId);
}

async function togglePlay(){
  if(!isLeaderNow()) return;
  const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  if(cur.gate){ startPlaybackAfterGate(cur); return; }
  const sch = scheduleInfo(cur);
  const t = serverNow();
  const next = {...cur, isPlaying: !cur.isPlaying, updatedAt:t, updatedBy:state.myName, seekTo:null, leaderTime:{time:sch.pos, ts:t}};
  pushRoomState(next);
}
function getMyBestKnownTime(cur){ return scheduleInfo(cur).pos; }
function leaderSeekTo(cur, abs){
  const d = lastKnownPlayerInfo.duration || 0;
  let t = Math.max(0, Math.round(abs));
  if(d > 0) t = Math.min(t, Math.max(0, Math.floor(d) - 1));
  const now = serverNow();
  pushRoomState({...cur, updatedAt:now, updatedBy:state.myName, seekTo:null, leaderTime:{time:t, ts:now}});
}
async function seekBy(seconds){
  if(!isLeaderNow()) return;
  const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  if(cur.gate) return;
  leaderSeekTo(cur, scheduleInfo(cur).pos + seconds);
}
async function seekToAbs(absSeconds){
  if(!isLeaderNow()) return;
  const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  if(cur.gate) return;
  leaderSeekTo(cur, absSeconds || 0);
}
async function jumpToInput(){
  if(!isLeaderNow()) return;
  const val = document.getElementById('jumpInput').value;
  const secs = parseInt(val, 10);
  if(isNaN(secs)) return;
  const cur = getCachedRoomState() || await getRoomState(state.roomCode) || {};
  if(cur.gate) return;
  leaderSeekTo(cur, secs);
  document.getElementById('jumpInput').value = '';
}

/* ============================================================
   محرك المزامنة (Sync Engine) — الفكرة الأساسية:
   1) ساعة موحّدة: كل الأجهزة تستخدم وقت سيرفر Firebase (وليس ساعة الجهاز)، فينتهي انحراف الساعات
      الذي كان يسبب "قفزات" متكررة.
   2) جدول زمني واحد (Schedule): القائد يضبط نقطة ارتكاز {الثانية، وقت السيرفر، تشغيل/إيقاف} فقط عند
      ضغطه (تشغيل/إيقاف/تقديم/فيديو جديد). بعدها كل جهاز (والقائد نفسه) يحسب مكانه المتوقع محليًا
      ويلحق به بنفسه — بدون أي بث دوري يقطع التشغيل.
   3) بوابة تحميل (Gate): عند اختيار فيديو، الجميع يحمّلون مسبقًا (≈20% من الفيديو بحد أقصى 30 ثانية)
      ولا يبدأ التشغيل إلا لما يكون الجميع جاهزين (أو انتهت مهلة 30 ثانية).
   4) لحاق ذكي: انحراف صغير = تعديل سرعة خفيف (1.25x / 0.75x) بدون أي إعادة تحميل،
      انحراف كبير = الإيقاف المؤقت وتحميل 15 ثانية قدّام ثم القفز للحظة الحالية.
   ============================================================ */
const SYNC = {
  TICK_MS: 400,
  GATE_FRACTION: 0.20,        // نسبة التحميل المسبق من طول الفيديو
  GATE_MIN_SEC: 5,
  GATE_MAX_TARGET_SEC: 30,    // سقف التحميل المسبق (يوتيوب لا يحمّل أكثر بكثير من هذا)
  GATE_TIMEOUT_MS: 30000,
  CATCHUP_AHEAD_SEC: 15,      // أثناء اللحاق: نحمّل 15 ثانية قدّام قبل ما نرجع للمزامنة
  CATCHUP_TIMEOUT_MS: 25000,
  HARD_DRIFT_SEC: 4,
  RATE_ENTER_SEC: 0.5,
  RATE_EXIT_SEC: 0.2,
  START_LEAD_MS: 1800,        // مهلة بين قرار البدء ولحظة البدء الفعلية ليصل القرار للجميع
  STALL_LIMIT_MS: 8000
};

let serverOffset = 0;
let serverOffsetRtt = Infinity;
function serverNow(){ return Date.now() + serverOffset; }
function encKey(n){ return String(n || '').replace(/[.$#\[\]\/]/g, '_'); }

async function calibrateServerClock(){
  if(!state.roomCode || !state.myName) return;
  const url = FIREBASE_DB_URL + '/rooms/' + state.roomCode + '/clock/' + encKey(state.myName) + '.json';
  let best = null;
  for(let i = 0; i < 5; i++){
    const t0 = Date.now();
    try{
      const res = await fetch(url, {method:'PUT', cache:'no-store', headers:{'Content-Type':'application/json'}, body: JSON.stringify({'.sv':'timestamp'})});
      let v = res.ok ? await res.json() : null;
      let t1 = Date.now();
      if(typeof v !== 'number' && res.ok){
        const g = await fetch(url + '?_=' + Date.now(), {cache:'no-store'});
        v = await g.json();
        t1 = Date.now();
      }
      if(typeof v === 'number'){
        const rtt = t1 - t0;
        const off = v - (t0 + t1) / 2;
        if(!best || rtt < best.rtt) best = {rtt, off};
      }
    }catch(e){}
  }
  if(best && (serverOffsetRtt === Infinity || best.rtt <= serverOffsetRtt + 60)){
    serverOffset = best.off;
    serverOffsetRtt = best.rtt;
  }
}

function isSyncablePlatform(platform, mediaId){
  if(platform === 'youtube') return true;
  if(platform === 'generic' && mediaId){
    try{ return detectGenericEmbed(mediaId).kind === 'file'; }catch(e){}
  }
  return false;
}
// حقول تُضاف عند تحميل فيديو جديد: تفتح بوابة التحميل المسبق (للمنصات التي تدعم التحكم)
function freshLoadFields(platform, mediaId){
  const sync = isSyncablePlatform(platform, mediaId);
  const loadId = genMsgId();
  const t = serverNow();
  return {
    loadId,
    isPlaying: !sync,
    gate: sync ? {loadId, startedAt:t} : null,
    seekTo: null,
    leaderTime: {time:0, ts:t},
    updatedAt: t
  };
}
// المكان المتوقع حاليًا حسب الجدول الزمني المشترك
function scheduleInfo(rs){
  const lt = (rs && rs.leaderTime) || {time:0, ts:0};
  const base = lt.time || 0;
  if(!rs || rs.gate) return {playing:false, pos:0};
  if(!rs.isPlaying) return {playing:false, pos:base};
  const el = (serverNow() - (lt.ts || serverNow())) / 1000;
  if(el < 0) return {playing:false, pos:base, pendingStart:true};
  return {playing:true, pos:base + el};
}

/* ---------- محوّل المشغّل (يوتيوب / ملف فيديو مباشر) بنفس الواجهة ---------- */
const ytAdapter = {
  ready(){ return lastKnownPlayerInfo.currentTime != null && lastKnownPlayerInfo.playerState != null; },
  time(){
    const i = lastKnownPlayerInfo;
    if(i.currentTime == null) return null;
    let t = i.currentTime;
    if(i.playerState === 1 && i.at) t += ((performance.now() - i.at) / 1000) * (i.rate || 1);
    return t;
  },
  state(){ return lastKnownPlayerInfo.playerState; },
  duration(){ return lastKnownPlayerInfo.duration || 0; },
  bufferEnd(){
    const i = lastKnownPlayerInfo;
    if(i.loadedFraction == null || !i.duration) return null;
    return i.loadedFraction * i.duration;
  },
  play(){ ytCommand(iframeEl, 'playVideo'); },
  pause(){ ytCommand(iframeEl, 'pauseVideo'); },
  seek(t){ ytCommand(iframeEl, 'seekTo', [Math.max(0, t), true]); },
  setRate(r){ ytCommand(iframeEl, 'setPlaybackRate', [r]); lastKnownPlayerInfo.rate = r; },
  unmute(){ ytCommand(iframeEl, 'unMute'); ytCommand(iframeEl, 'setVolume', [100]); },
  isMuted(){ return lastKnownPlayerInfo.muted; }
};
const fileAdapter = {
  ready(){ return !!videoEl && videoEl.readyState >= 1; },
  time(){ return videoEl.currentTime; },
  state(){
    if(videoEl.ended) return 0;
    if(videoEl.paused) return 2;
    if(videoEl.readyState < 3) return 3;
    return 1;
  },
  duration(){ return isFinite(videoEl.duration) ? videoEl.duration : 0; },
  bufferEnd(){
    const b = videoEl.buffered, t = videoEl.currentTime;
    for(let i = 0; i < b.length; i++){
      if(t >= b.start(i) - 0.25 && t <= b.end(i) + 0.25) return b.end(i);
    }
    return t;
  },
  play(){ videoEl.play().catch(() => {}); },
  pause(){ videoEl.pause(); },
  seek(t){ try{ videoEl.currentTime = Math.max(0, t); }catch(e){} },
  setRate(r){ try{ videoEl.playbackRate = r; }catch(e){} },
  unmute(){ videoEl.muted = false; videoEl.volume = 1; },
  isMuted(){ return videoEl.muted; }
};
function getPlayerAdapter(){
  if(state.platform === 'youtube' && iframeEl && state.videoId) return ytAdapter;
  if(state.platform === 'generic' && videoEl) return fileAdapter;
  return null;
}

/* ---------- واجهة: طبقة التحميل فوق الفيديو + زر تفعيل الصوت ---------- */
function ensureSyncOverlay(frame){
  frame.querySelectorAll('.sync-overlay, .unmute-btn').forEach(e => e.remove());
  const ov = document.createElement('div');
  ov.className = 'sync-overlay';
  ov.id = 'syncOverlay';
  ov.innerHTML = `<div class="sync-box"><div class="sync-spinner"></div><div class="sync-text" id="syncText">جاري الاتصال بالفيديو…</div><div class="sync-bar"><div class="sync-bar-fill" id="syncBarFill"></div></div></div>`;
  frame.appendChild(ov);
  const ub = document.createElement('button');
  ub.className = 'unmute-btn';
  ub.id = 'unmuteBtn';
  ub.textContent = '🔊 اضغط لتفعيل الصوت';
  ub.style.display = 'none';
  ub.onclick = (e) => {
    e.stopPropagation();
    const ad = getPlayerAdapter();
    if(ad) ad.unmute();
    syncCtl.unmuteAttempts = 0;
    ub.style.display = 'none';
  };
  frame.appendChild(ub);
}
function setSyncOverlay(info){
  const ov = document.getElementById('syncOverlay');
  if(!ov) return;
  if(!info){ ov.classList.remove('show'); return; }
  ov.classList.add('show');
  const t = document.getElementById('syncText');
  const f = document.getElementById('syncBarFill');
  if(t) t.textContent = info.text + ((info.pct != null) ? (' ' + Math.round(info.pct * 100) + '%') : '');
  if(f){
    if(info.pct == null){ f.classList.add('indeterminate'); f.style.width = ''; }
    else { f.classList.remove('indeterminate'); f.style.width = Math.round(info.pct * 100) + '%'; }
  }
}
function setUnmuteVisible(v){
  const b = document.getElementById('unmuteBtn');
  if(b) b.style.display = v ? '' : 'none';
}

/* ---------- المتحكّم المحلي ---------- */
const syncCtl = {
  key:null, mode:'init', holdKind:null, holdPos:0, holdSince:0,
  lastBuf:0, lastBufChange:0, ignoreUntil:0, lastSeekAt:0, rate:1,
  readySent:null, stallSince:0, lastUnmuteAt:0, unmuteAttempts:0
};
const syncCmdAt = {};
function cmdOk(name, ms){
  const n = performance.now();
  if(n - (syncCmdAt[name] || 0) < ms) return false;
  syncCmdAt[name] = n;
  return true;
}
function resetSyncCtl(key){
  Object.assign(syncCtl, {
    key:key, mode:'init', holdKind:null, holdPos:0, holdSince:0,
    lastBuf:0, lastBufChange:0, ignoreUntil:0, lastSeekAt:0, rate:1,
    readySent:null, stallSince:0, lastUnmuteAt:0, unmuteAttempts:0
  });
  for(const k in syncCmdAt) delete syncCmdAt[k];
}
function holdTargetEnd(kind, pos, dur){
  const need = kind === 'gate'
    ? Math.min(Math.max((dur || 0) * SYNC.GATE_FRACTION, SYNC.GATE_MIN_SEC), SYNC.GATE_MAX_TARGET_SEC)
    : SYNC.CATCHUP_AHEAD_SEC;
  const end = pos + need;
  return dur > 0 ? Math.min(end, Math.max(pos, dur - 0.5)) : end;
}
function startHold(ad, kind, pos, dur){
  const perf = performance.now();
  syncCtl.mode = 'hold';
  syncCtl.holdKind = kind;
  syncCtl.holdPos = pos;
  syncCtl.holdSince = perf;
  syncCtl.lastBuf = pos;
  syncCtl.lastBufChange = perf;
  syncCtl.stallSince = 0;
  if(syncCtl.rate !== 1){ ad.setRate(1); syncCtl.rate = 1; }
  ad.pause();
  ad.seek(pos);
  syncCtl.lastSeekAt = perf;
}
function finishHold(ad){
  const perf = performance.now();
  syncCtl.mode = 'sync';
  syncCtl.ignoreUntil = perf + 3000;
  syncCtl.lastSeekAt = perf;
  syncCtl.holdKind = null;
  if(syncCtl.rate !== 1){ ad.setRate(1); syncCtl.rate = 1; }
  setSyncOverlay(null);
}
function reportReady(loadId){
  if(!state.roomCode) return;
  fbSet('rooms/' + state.roomCode + '/ready/' + encKey(state.myName), {key:loadId, ts:Date.now()});
}
// أنا متأخر عن الجدول: إذا المكان المطلوب محمّل أصلًا نقفز له مباشرة، وإلا نحمّل 15 ثانية قدّام أولًا
function handleBehind(ad, exp, cur, dur){
  const perf = performance.now();
  const bEnd = ad.bufferEnd();
  const target = dur > 0 ? Math.min(exp, Math.max(0, dur - 0.5)) : exp;
  if(bEnd != null && target > cur && target < bEnd - 1.5){
    ad.seek(target);
    ad.play();
    syncCtl.ignoreUntil = perf + 3000;
    syncCtl.lastSeekAt = perf;
  } else {
    startHold(ad, 'catchup', target + 4, dur);
  }
}

function syncTick(){
  try{
    if(state.screen !== 'room') return;
    const ad = getPlayerAdapter();
    const rs = lastKnownRoomState;
    if(!ad || !rs){ setSyncOverlay(null); return; }
    const key = rs.loadId || (state.platform + ':' + (state.videoId || state.mediaId));
    if(syncCtl.key !== key) resetSyncCtl(key);
    if(!ad.ready()){ setSyncOverlay({text:'جاري الاتصال بالفيديو…', pct:null}); return; }

    const perf = performance.now();
    const dur = ad.duration();
    const cur = ad.time();
    const st = ad.state();
    const sch = scheduleInfo(rs);
    const gating = !!(rs.gate && rs.gate.loadId === rs.loadId);

    // --- الدخول/الخروج من بوابة التحميل المسبق ---
    if(gating){
      if(!(syncCtl.mode === 'hold' && syncCtl.holdKind === 'gate')) startHold(ad, 'gate', 0, dur);
    } else if(syncCtl.mode === 'hold' && syncCtl.holdKind === 'gate'){
      syncCtl.mode = 'sync';
      syncCtl.ignoreUntil = perf + 1500;
      setSyncOverlay(null);
    } else if(syncCtl.mode === 'init'){
      syncCtl.mode = 'sync';
    }

    // --- وضع التحميل المسبق / اللحاق ---
    if(syncCtl.mode === 'hold'){
      const held = perf - syncCtl.holdSince;
      const isGate = syncCtl.holdKind === 'gate';
      const targetEnd = holdTargetEnd(syncCtl.holdKind, syncCtl.holdPos, dur);
      const bEnd = ad.bufferEnd();
      let pct = null;
      if(bEnd != null){
        const need = Math.max(0.5, targetEnd - syncCtl.holdPos);
        pct = Math.max(0, Math.min(1, (bEnd - syncCtl.holdPos) / need));
        if(bEnd > syncCtl.lastBuf + 0.25){ syncCtl.lastBuf = bEnd; syncCtl.lastBufChange = perf; }
      }
      const bufOk = bEnd != null ? (bEnd >= targetEnd - 0.2) : held > 6000;
      const plateau = bEnd != null && (perf - syncCtl.lastBufChange) > 6000 && (bEnd - syncCtl.holdPos) >= 5;
      const timedOut = held > (isGate ? SYNC.GATE_TIMEOUT_MS : SYNC.CATCHUP_TIMEOUT_MS);
      const good = bufOk || plateau || timedOut;

      if(st === 1 && cmdOk('holdpause', 800)) ad.pause();
      if(!good && (perf - syncCtl.lastBufChange) > 4500 && cmdOk('kick', 4000)) ad.seek(syncCtl.holdPos);

      if(isGate){
        if(good && syncCtl.readySent !== rs.loadId){
          syncCtl.readySent = rs.loadId;
          reportReady(rs.loadId);
        }
        if(syncCtl.readySent === rs.loadId) setSyncOverlay({text:'جاهز ✅ بانتظار بقية الأعضاء…', pct:1});
        else setSyncOverlay({text:'جاري تحميل الفيديو لتجربة سلسة…', pct});
        return;
      }

      // اللحاق
      const exp = sch.pos;
      if(!sch.playing){ syncCtl.mode = 'sync'; syncCtl.ignoreUntil = perf + 500; setSyncOverlay(null); return; }
      if(exp < syncCtl.holdPos - 6){ syncCtl.mode = 'sync'; setSyncOverlay(null); return; }
      if(!good){ setSyncOverlay({text:'جاري التحميل لضمان تشغيل سلس…', pct}); return; }
      if(exp < syncCtl.holdPos - 0.15){ setSyncOverlay({text:'جاهز ✅ ثواني ونكمل معكم…', pct:1}); return; }
      if(timedOut || bEnd == null || exp <= bEnd - 2){
        const t = dur > 0 ? Math.min(exp, Math.max(0, dur - 0.5)) : exp;
        ad.seek(t);
        ad.play();
        finishHold(ad);
      } else {
        startHold(ad, 'catchup', exp + 4, dur);
      }
      return;
    }

    // --- الوضع العادي: اتبع الجدول المشترك ---
    if(!sch.playing){
      setSyncOverlay(null);
      if(syncCtl.rate !== 1){ ad.setRate(1); syncCtl.rate = 1; }
      if((st === 1 || st === 3) && cmdOk('pause', 900)) ad.pause();
      if(Math.abs(cur - sch.pos) > 1.2 && perf >= syncCtl.ignoreUntil && (perf - syncCtl.lastSeekAt) > 2500){
        ad.seek(sch.pos);
        syncCtl.lastSeekAt = perf;
      }
      return;
    }

    const exp = sch.pos;
    if(dur > 0 && exp >= dur - 0.3){ setSyncOverlay(null); return; }
    const drift = exp - cur; // موجب = أنا متأخر

    if(st === 3){ // تحميل (Buffering): لا نقفز ولا نرسل أوامر، فقط ننتظر
      if(!syncCtl.stallSince) syncCtl.stallSince = perf;
      const stalled = perf - syncCtl.stallSince;
      if(stalled > SYNC.STALL_LIMIT_MS && perf >= syncCtl.ignoreUntil){
        syncCtl.stallSince = 0;
        startHold(ad, 'catchup', exp + 4, dur);
      } else if(stalled > 1500){
        setSyncOverlay({text:'جاري التحميل…', pct:null});
      }
      return;
    }
    syncCtl.stallSince = 0;
    setSyncOverlay(null);

    if(st === 0) return; // انتهى الفيديو

    if(st !== 1){ // لازم يشتغل لكنه واقف: شغّله (أو لحّق إذا الفرق كبير)
      if(drift > SYNC.HARD_DRIFT_SEC){ handleBehind(ad, exp, cur, dur); return; }
      if(cmdOk('play', 900)){
        if(Math.abs(drift) > 1.0){ ad.seek(exp); syncCtl.lastSeekAt = perf; syncCtl.ignoreUntil = perf + 2500; }
        ad.play();
      }
      return;
    }

    // st === 1 (يعمل): إلغاء الكتم تلقائيًا (بدأنا كتم لأجل التحميل المسبق)
    const muted = ad.isMuted();
    if((muted === true || (muted === undefined && syncCtl.unmuteAttempts < 3)) && perf - syncCtl.lastUnmuteAt > 2500){
      ad.unmute();
      syncCtl.lastUnmuteAt = perf;
      syncCtl.unmuteAttempts++;
    } else if(muted === false){
      syncCtl.unmuteAttempts = 0;
    }
    setUnmuteVisible(muted === true && syncCtl.unmuteAttempts >= 3);

    if(perf < syncCtl.ignoreUntil) return;

    if(drift > SYNC.HARD_DRIFT_SEC){ handleBehind(ad, exp, cur, dur); return; }
    if(drift < -SYNC.HARD_DRIFT_SEC){
      ad.seek(exp);
      syncCtl.lastSeekAt = perf;
      syncCtl.ignoreUntil = perf + 3000;
      return;
    }
    // تعديل سرعة خفيف بدل القفز (لا إعادة تحميل ولا تقطيع)
    let targetRate = syncCtl.rate;
    if(syncCtl.rate === 1){
      if(drift > SYNC.RATE_ENTER_SEC) targetRate = 1.25;
      else if(drift < -SYNC.RATE_ENTER_SEC) targetRate = 0.75;
    } else if(syncCtl.rate > 1){
      if(drift < SYNC.RATE_EXIT_SEC) targetRate = 1;
    } else {
      if(drift > -SYNC.RATE_EXIT_SEC) targetRate = 1;
    }
    if(targetRate !== syncCtl.rate){
      ad.setRate(targetRate);
      syncCtl.rate = targetRate;
    }
  }catch(e){ /* ما نسمح لأي خطأ بإيقاف المحرك */ }
}

/* ---------- القائد: يبدأ التشغيل للجميع لما يجهز الكل (أو انتهت المهلة) ---------- */
function leaderGateMonitor(){
  const rs = lastKnownRoomState;
  if(!rs || !rs.gate || !isLeaderNow()) return;
  const key = rs.gate.loadId;
  const names = Object.keys(state.users || {});
  const ready = state.ready || {};
  const allReady = names.length > 0 && names.every(n => ready[encKey(n)] && ready[encKey(n)].key === key);
  const timedOut = (serverNow() - (rs.gate.startedAt || 0)) > (SYNC.GATE_TIMEOUT_MS + 3000);
  if(allReady || timedOut) startPlaybackAfterGate(rs);
}
function startPlaybackAfterGate(rs){
  if(!isLeaderNow() || !rs || !rs.gate) return;
  const startTs = serverNow() + SYNC.START_LEAD_MS;
  const next = {...rs, gate:null, isPlaying:true, leaderTime:{time:0, ts:startTs}, updatedAt:serverNow(), updatedBy:state.myName, seekTo:null};
  pushRoomState(next);
}

let syncTickTimer = null, clockTimer = null;
function startSyncEngine(){
  stopSyncEngine();
  calibrateServerClock();
  clockTimer = setInterval(calibrateServerClock, 30000);
  syncTickTimer = setInterval(syncTick, SYNC.TICK_MS);
}
function stopSyncEngine(){
  if(syncTickTimer) clearInterval(syncTickTimer);
  if(clockTimer) clearInterval(clockTimer);
  syncTickTimer = null; clockTimer = null;
}

let fastPollBusy = false;
async function pollStateOnly(){
  if(fastPollBusy || !state.roomCode) return;
  fastPollBusy = true;
  try{
    const code = state.roomCode;
    const rs = await getRoomState(code);
    if(!rs || code !== state.roomCode) return;
    if(!lastKnownRoomState || (rs.updatedAt || 0) > (lastKnownRoomState.updatedAt || 0)){
      lastKnownRoomState = rs;
      applyRoomState(rs);
    }
    if(rs.gate && isLeaderNow()){
      const ready = await fbGet('rooms/' + code + '/ready');
      state.ready = (ready && typeof ready === 'object') ? ready : {};
      leaderGateMonitor();
    }
  } finally {
    fastPollBusy = false;
  }
}

let lastAppliedUpdate = 0;
// نسخة محلية من آخر حالة غرفة معروفة (تُحدَّث من كل poll() ومن كل تعديل يسويه القائد نفسه).
// الهدف: أي زر يضغطه القائد (تشغيل/إيقاف/تقديم/رجوع/اختيار فيديو) ينطبق على شاشته فورًا
// من غير ما ينتظر جولة كاملة (قراءة + كتابة) عالسيرفر — وهذا كان سبب التأخير الملحوظ.
let lastKnownRoomState = null;
function getCachedRoomState(){
  return lastKnownRoomState ? {...lastKnownRoomState} : null;
}
// يطبّق الحالة الجديدة على شاشة القائد فورًا (محليًا)، ثم يرسلها للسيرفر بالخلفية بدون انتظار
// (ما نستخدم await قبل التطبيق المحلي — هذا هو الفرق الأساسي اللي يلغي الشعور بالتأخير)
function pushRoomState(next){
  lastKnownRoomState = next;
  applyRoomState(next);
  setRoomState(state.roomCode, next); // إرسال بالخلفية، بدون انتظار
}
function applyRoomState(data){
  if(!data) return;
  const platform = data.platform || 'youtube';
  const mediaChanged = (platform !== state.platform) || ((data.videoId || null) !== (state.videoId || null)) || ((data.mediaId || null) !== (state.mediaId || null)) || ((data.loadId || null) !== (state.loadId || null));
  state.platform = platform;
  state.queue = Array.isArray(data.queue) ? data.queue : [];
  state.queueIndex = typeof data.queueIndex === 'number' ? data.queueIndex : -1;
  state.randomMode = !!data.randomMode;
  if(mediaChanged){
    state.videoId = data.videoId || null;
    state.mediaId = data.mediaId || null;
    state.loadId = data.loadId || null;
    uiActivePlatform = platform;
    lastSuggestionsForVideoId = null;
    state.suggestions = null;
    if(isLeaderNow() && state.roomCode) clearSuggestionsState(state.roomCode);
    renderSuggestionsOnly();
    if(state.screen === 'room' && document.getElementById('videoFrame')) remountVideoFrame();
    else render();
  } else if(document.getElementById('leaderControlsWrap')){
    renderLeaderControlsOnly();
  }
  // التحكم بالتشغيل/الإيقاف/التقديم صار كله عبر محرك المزامنة (syncTick) الذي يتبع الجدول المشترك
  syncTick();
}

let pendingMessages = [];
let editingId = null;
let replyingId = null;
const EDIT_WINDOW_MS = 60 * 1000;

/* ---------- الرد على رسالة ---------- */
function replyPreviewFor(m){
  if(!m) return null;
  if(m.type === 'image') return { name: m.name, preview: '📷 صورة' };
  if(m.type === 'audio') return { name: m.name, preview: '🎤 رسالة صوتية' };
  return { name: m.name, preview: (m.text || '').slice(0, 120) };
}
function startReply(id){
  const msg = state.chat.find(m => m.id === id && !m.sys);
  if(!msg) return;
  editingId = null; // الرد والتعديل ما ينفتحوا سوا
  replyingId = id;
  renderChatOnly();
  updateReplyBar();
  const inp = document.getElementById('chatInput');
  if(inp) inp.focus();
}
function cancelReply(){
  replyingId = null;
  updateReplyBar();
  renderChatOnly();
}
function scrollToMsg(id){
  const el = document.querySelector('.msg[data-id="' + id + '"]');
  if(el){
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.classList.add('flash-highlight');
    setTimeout(() => el.classList.remove('flash-highlight'), 900);
  }
}
function updateReplyBar(){
  const holder = document.getElementById('replyBarHolder');
  if(!holder) return;
  if(!replyingId){ holder.innerHTML = ''; if(window.mshmshAdjustChatLayout) setTimeout(window.mshmshAdjustChatLayout, 30); return; }
  const msg = state.chat.find(m => m.id === replyingId);
  if(!msg){ replyingId = null; holder.innerHTML = ''; if(window.mshmshAdjustChatLayout) setTimeout(window.mshmshAdjustChatLayout, 30); return; }
  const info = replyPreviewFor(msg);
  holder.innerHTML = `
    <div class="reply-bar">
      <div class="reply-bar-body">
        <div class="reply-bar-name">↩️ رد على ${escapeHtml(info.name)}</div>
        <div class="reply-bar-text">${escapeHtml(info.preview)}</div>
      </div>
      <span class="reply-bar-close" id="replyBarClose">✕</span>
    </div>`;
  const closeBtn = document.getElementById('replyBarClose');
  if(closeBtn) closeBtn.onclick = cancelReply;
  if(window.mshmshAdjustChatLayout) setTimeout(window.mshmshAdjustChatLayout, 30);
}
function buildReplyPayload(){
  if(!replyingId) return null;
  const msg = state.chat.find(m => m.id === replyingId);
  if(!msg) return null;
  const info = replyPreviewFor(msg);
  return { id: msg.id, name: info.name, preview: info.preview };
}

function genMsgId(){
  return state.myName + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
}
function setStatus(msg, isError){
  state.statusMsg = msg;
  const line = document.getElementById('statusLine');
  if(line){
    line.textContent = msg;
    line.style.color = isError ? '#ff8686' : '';
    line.style.fontWeight = isError ? '700' : 'normal';
  }
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const replyTo = buildReplyPayload();
  const msg = { id: genMsgId(), name: state.myName, type:'text', text, ts: Date.now(), gender: state.myGender || null };
  if(replyTo) msg.replyTo = replyTo;
  input.value = '';
  input.focus();
  replyingId = null;
  updateReplyBar();
  // اعرض الرسالة فورًا عند المرسل، بدون انتظار التخزين المشترك
  pendingMessages.push(msg);
  state.chat = [...state.chat, msg];
  renderChatOnly();
  try{
    await pushChatMessage(state.roomCode, msg);
  }catch(e){
    setStatus('تعذر حفظ آخر رسالة، ستتم إعادة المحاولة تلقائيًا');
  }
}

/* ---------- تعديل الرسائل خلال دقيقة ---------- */
function startEdit(id){
  const msg = state.chat.find(m => m.id === id);
  if(!msg) return;
  editingId = id;
  replyingId = null; // الرد والتعديل ما ينفتحوا سوا
  updateReplyBar();
  renderChatOnly();
  const inp = document.getElementById('editInput-' + id);
  if(inp){ inp.value = msg.text; inp.focus(); inp.select(); }
}
function cancelEdit(){
  editingId = null;
  renderChatOnly();
}
async function saveEdit(id){
  const inp = document.getElementById('editInput-' + id);
  if(!inp) return;
  const newText = inp.value.trim();
  if(!newText){ cancelEdit(); return; }
  const local = state.chat.find(m => m.id === id);
  if(local && Date.now() - local.ts > EDIT_WINDOW_MS){
    setStatus('انقضت مهلة الدقيقة، لا يمكنك تعديل هذه الرسالة');
    editingId = null; renderChatOnly(); return;
  }
  if(local){ local.text = newText; local.edited = true; }
  const pendingLocal = pendingMessages.find(m => m.id === id);
  if(pendingLocal){ pendingLocal.text = newText; pendingLocal.edited = true; }
  editingId = null;
  renderChatOnly();
  const ok = await editChatMessage(state.roomCode, id, newText);
  if(!ok) setStatus('تعذر حفظ التعديل، حاول مرة أخرى');
}
async function editChatMessage(code, id, newText){
  try{
    const list = await getRoomChat(code);
    const idx = list.findIndex(m => m.id === id);
    if(idx === -1) return true; // لسه ما وصلت للتخزين، رح تنحفظ بالنص الجديد عند أول push
    const m = list[idx];
    if(m.name !== state.myName) return false;
    if(Date.now() - m.ts > EDIT_WINDOW_MS) return false;
    m.text = newText;
    m.edited = true;
    m.editedAt = Date.now();
    list[idx] = m;
    await fbSet('rooms/'+code+'/chat', list);
    return true;
  }catch(e){ return false; }
}

/* ---------- إرسال صورة ---------- */
function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function sendImageFile(file){
  if(!file || !file.type.startsWith('image/')){ setStatus('اختر ملف صورة صحيح'); return; }
  try{
    setStatus('جاري تجهيز الصورة...');
    const dataUrl = await resizeImageFile(file);
    const approxBytes = dataUrl.length * 0.75;
    if(approxBytes > 1.6 * 1024 * 1024){
      setStatus('الصورة كبيرة بعض الشيء حتى بعد الضغط، جرّب صورة أخرى');
      return;
    }
    const replyTo = buildReplyPayload();
    const msg = { id: genMsgId(), name: state.myName, type:'image', dataUrl, ts: Date.now(), gender: state.myGender || null };
    if(replyTo) msg.replyTo = replyTo;
    replyingId = null;
    updateReplyBar();
    pendingMessages.push(msg);
    state.chat = [...state.chat, msg];
    renderChatOnly();
    setStatus('');
    await pushChatMessage(state.roomCode, msg);
  }catch(e){
    setStatus('تعذر إرسال الصورة');
  }
}

/* ---------- تسجيل رسالة صوتية ---------- */
let mediaRecorder = null;
let audioChunks = [];
let recordStartTs = null;
let recordTimerInterval = null;

async function toggleRecording(){
  const micBtn = document.getElementById('micBtn');
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('التسجيل الصوتي غير مدعوم في هذا المتصفح، جرّب فتح الملف مباشرة في متصفح حديث');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordTimerInterval);
      const btn = document.getElementById('micBtn');
      if(btn){ btn.classList.remove('recording'); btn.textContent = '🎤'; btn.title = 'رسالة صوتية'; }
      const blob = new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      if(blob.size < 500) return; // تسجيل قصير جدًا/فارغ
      const durationSec = Math.max(1, Math.round((Date.now() - recordStartTs) / 1000));
      const reader = new FileReader();
      reader.onload = async () => {
        const dataUrl = reader.result;
        const approxBytes = dataUrl.length * 0.75;
        if(approxBytes > 3 * 1024 * 1024){
          setStatus('المقطع الصوتي طويل بعض الشيء، سجّل مقطعًا أقصر');
          return;
        }
        const replyTo = buildReplyPayload();
        const msg = { id: genMsgId(), name: state.myName, type:'audio', dataUrl, duration: durationSec, ts: Date.now(), gender: state.myGender || null };
        if(replyTo) msg.replyTo = replyTo;
        replyingId = null;
        updateReplyBar();
        pendingMessages.push(msg);
        state.chat = [...state.chat, msg];
        renderChatOnly();
        try{ await pushChatMessage(state.roomCode, msg); }catch(e){ setStatus('تعذر إرسال المقطع الصوتي'); }
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    recordStartTs = Date.now();
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹️';
    let secs = 0;
    recordTimerInterval = setInterval(() => {
      secs++;
      micBtn.title = 'إيقاف التسجيل (' + secs + 'ث)';
      if(secs >= 60) mediaRecorder.stop(); // حد أقصى للحجم
    }, 1000);
  }catch(e){
    setStatus('تعذر الوصول إلى الميكروفون — تأكد من منح إذن الميكروفون، أو افتح الملف مباشرة في المتصفح بدل المعاينة');
  }
}

/* لو التطبيق انفتح عن طريق مشاركة رابط من تطبيق ثاني (share target) أو رابط يحتوي
   ?url= أو ?text= أو ?share_url= نحاول نلتقط رابط الفيديو تلقائيًا */
function getSharedUrlFromLocation(){
  try{
    const params = new URLSearchParams(window.location.search);
    const candidate = params.get('share_url') || params.get('url') || params.get('text') || '';
    const m = candidate.match(/https?:\/\/\S+/);
    return m ? m[0] : (candidate || null);
  }catch(e){ return null; }
}

let fastPollTimer = null;

/* ============ leader broadcast: يبث القائد ثانيته الحالية بانتظام حتى لو نته ضعيف
   (البث يعتمد على تخزين الغرفة، مو على تحميل فيديو القائد نفسه) ============ */
function startLeaderSync(){
  stopLeaderSync();
  leaderSyncTimer = setInterval(() => {
    if(!isLeaderNow() || !state.roomCode || !(state.videoId || state.mediaId)) return;
    leaderGateMonitor();
    // فيديو يوتيوب خلص — نجهّز مقترحات للجميع (القائد فقط يختار منها)
    if(lastKnownPlayerInfo.playerState === 0) handleVideoEndedForSuggestions();
  }, 800);
}
function stopLeaderSync(){
  if(leaderSyncTimer) clearInterval(leaderSyncTimer);
  leaderSyncTimer = null;
}

async function poll(){
  if(!state.roomCode) return;
  const [rs, chat, users, game, suggestionsRaw] = await Promise.all([
    getRoomState(state.roomCode),
    getRoomChat(state.roomCode),
    touchPresence(state.roomCode, state.myName),
    getGameState(state.roomCode),
    getSuggestionsState(state.roomCode)
  ]);
  if(isRoomExpired(rs)){
    handleRoomExpired();
    return;
  }
  if(rs && rs.createdBy && rs.createdBy !== state.roomCreatedBy){
    state.roomCreatedBy = rs.createdBy;
    renderTopbarOnly();
  }
  // نحدّث النسخة المحلية من حالة الغرفة فقط إذا هذا التحديث أحدث من آخر شي طبّقناه محليًا نحن أنفسنا
  // (حتى لو القائد ضغط زر لتوّه، ما نخلي رد فعل بولّ قديم بالشبكة يرجّع حالة قديمة فوق تعديله الفوري)
  if(rs && (!lastKnownRoomState || (rs.updatedAt || 0) >= (lastKnownRoomState.updatedAt || 0))){
    lastKnownRoomState = rs;
  }
  state.users = users;
  // ادمج رسائل التخزين مع أي رسائل محلية لسه ما تأكدنا انها انحفظت
  const fetchedIds = new Set(chat.filter(m => m.id).map(m => m.id));
  pendingMessages = pendingMessages.filter(m => !fetchedIds.has(m.id));
  const merged = [...chat, ...pendingMessages].sort((a,b) => a.ts - b.ts);
  const chatChanged = JSON.stringify(merged) !== JSON.stringify(state.chat);
  state.chat = merged;
  applyRoomState(lastKnownRoomState || rs);

  // إذا فيه لعبة شغّالة بالغرفة (جديدة أو ما شفناها بعد)، نعرضها تلقائيًا لكل الأعضاء (حتى المتفرجين)
  // نعتمد على معرف اللعبة (id) مو مجرد "أول مرة بالجلسة" — حتى لو سكّر العضو اللوحة قبل كذا،
  // أي لعبة جديدة (سواء نوع مختلف أو "لعبة جديدة" من نفس النوع) تنفتح له تلقائيًا من جديد
  const gameChanged = JSON.stringify(game) !== JSON.stringify(state.game);
  state.game = game;
  if(game && game.id && game.id !== lastAutoShownGameId){
    lastAutoShownGameId = game.id;
    state.gamePanelOpen = true;
  }
  if(gameChanged) renderGameOnly();
  updateGamesBadge();

  // لعبة الرسم: جهاز الرسام نفسه يراقب الدردشة، وإذا لقى رسالة مطابقة للكلمة السرية (من عضو غيره) يُنهي الجولة تلقائيًا كـ"عرفوها"
  if(state.game && state.game.type === 'draw' && state.game.phase === 'drawing' && state.game.drawer === state.myName && state.game.word){
    const target = normalizeGuessText(state.game.word);
    const startTs = state.game.startTs || 0;
    const candidate = merged.find(m => !m.sys && m.name && m.name !== state.myName && m.ts >= startTs && normalizeGuessText(m.text) === target);
    if(candidate) endDrawRound('guessed', candidate.name);
  }

  // مقترحات نهاية الفيديو: تظهر للجميع طالما هي مربوطة بنفس الفيديو الحالي بالغرفة
  const validSuggestions = (suggestionsRaw && rs && suggestionsRaw.forVideoId === rs.videoId) ? suggestionsRaw : null;
  const suggChanged = JSON.stringify(validSuggestions) !== JSON.stringify(state.suggestions);
  state.suggestions = validSuggestions;
  if(suggChanged) renderSuggestionsOnly();

  renderTopbarOnly();
  if(chatChanged) renderChatOnly();
}

/* ============ سحب عمودي على الفيديو (زي تيك توك) — فقط لصاحب التاج ============ */
let swipeAttachedFrame = null;
function attachSwipeGesture(){
  const frame = document.getElementById('videoFrame');
  if(!frame || frame === swipeAttachedFrame) return; // ما نكرر الربط على نفس العنصر
  swipeAttachedFrame = frame;
  let startY = null, startX = null, startT = 0;
  const THRESHOLD = 55; // أقل مسافة سحب رأسية (px) تُعتبر "قلب فيديو"
  frame.addEventListener('touchstart', e => {
    if(!isLeaderNow() || !e.touches || !e.touches[0]) return;
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    startT = Date.now();
  }, {passive:true});
  frame.addEventListener('touchend', e => {
    if(!isLeaderNow() || startY == null) return;
    const endTouch = (e.changedTouches && e.changedTouches[0]) || null;
    if(!endTouch){ startY = null; return; }
    const dy = endTouch.clientY - startY;
    const dx = endTouch.clientX - startX;
    const dt = Date.now() - startT;
    startY = null;
    if(dt > 700) return; // سحبة بطيئة جدًا نتجاهلها
    if(Math.abs(dy) < THRESHOLD || Math.abs(dy) < Math.abs(dx)) return; // سحب أفقي أو قصير، نتجاهله
    if(dy < 0) nextInQueue(); // سحب لفوق = فيديو تالي
    else prevInQueue();       // سحب لتحت = فيديو سابق
  }, {passive:true});
}

/* ============ زر صغير على الفيديو يفتح/يقفل شريط أزرار التقليب (تشغيل/إيقاف/تقديم/رجوع) — فقط للقائد ============ */
/* ملاحظة مهمة: ما نحط أي طبقة تغطي الفيديو كامل، حتى ما نبلع أول ضغطة المستخدم اللي */
/* يحتاجها يوتيوب نفسه عشان يبدأ التشغيل (خصوصًا بالجوال). الزر صغير وفي زاوية فقط. */
function buildVideoOverlayControls(frame){
  const oldToggle = frame.querySelector('.voc-toggle');
  if(oldToggle) oldToggle.remove();
  const oldOverlay = frame.querySelector('.video-overlay-controls');
  if(oldOverlay) oldOverlay.remove();

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'voc-toggle';
  toggleBtn.title = 'أزرار التقليب';
  toggleBtn.textContent = '⋯';
  frame.appendChild(toggleBtn);

  const overlay = document.createElement('div');
  overlay.className = 'video-overlay-controls';
  overlay.innerHTML = `
    <div class="voc-buttons">
      <button class="voc-btn" id="vocFwdBtn" title="تقديم 10 ثواني">▶▶</button>
      <button class="voc-btn voc-btn-main" id="vocPlayBtn" title="تشغيل / إيقاف">▶</button>
      <button class="voc-btn" id="vocBackBtn" title="رجوع 10 ثواني">◀◀</button>
    </div>
    <div class="voc-progress-wrap">
      <div class="voc-progress"><div class="voc-progress-fill" id="vocProgressFill"></div></div>
      <div class="voc-time" id="vocTimeLabel">0:00 / --:--</div>
    </div>
  `;
  frame.appendChild(overlay);

  let hideTimer = null;
  const showOverlay = () => {
    overlay.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => overlay.classList.remove('show'), 4000);
  };
  const hideOverlay = () => { overlay.classList.remove('show'); clearTimeout(hideTimer); };

  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if(overlay.classList.contains('show')) hideOverlay(); else showOverlay();
  });

  overlay.querySelector('#vocPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); showOverlay(); });
  overlay.querySelector('#vocFwdBtn').addEventListener('click', (e) => { e.stopPropagation(); seekBy(10); showOverlay(); });
  overlay.querySelector('#vocBackBtn').addEventListener('click', (e) => { e.stopPropagation(); seekBy(-10); showOverlay(); });

  /* ---------- شريط التقدّم: سحب/ضغط للانتقال لأي لحظة بالفيديو ---------- */
  const progressWrap = overlay.querySelector('.voc-progress-wrap');
  const progressBar = overlay.querySelector('.voc-progress');
  const progressFill = overlay.querySelector('#vocProgressFill');
  const timeLabel = overlay.querySelector('#vocTimeLabel');
  let dragging = false;

  const fractionFromEvent = (e) => {
    // الشريط عنصر block عادي فيمتلئ فيزيائيًا من اليسار لليمين دائمًا (زي تحديث setInterval الأصلي بالأعلى
    // اللي يضبط width% مباشرة بدون أي عكس)، بغض النظر عن اتجاه الصفحة RTL — فنطابق نفس المنطق هنا
    const rect = progressBar.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX, rect.left), rect.right);
    const frac = (x - rect.left) / (rect.width || 1);
    return Math.min(1, Math.max(0, frac));
  };
  const previewAt = (frac) => {
    const dur = lastKnownPlayerInfo.duration || 0;
    if(dur <= 0) return;
    progressFill.style.width = (frac * 100) + '%';
    if(timeLabel) timeLabel.textContent = `${fmtSecsShort(frac * dur)} / ${fmtSecsShort(dur)}`;
  };

  progressWrap.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    if(!isLeaderNow()) return;
    const dur = lastKnownPlayerInfo.duration || 0;
    if(dur <= 0) return; // لسه ما وصلنا مدة الفيديو من يوتيوب — ننتظر أول تحديث
    dragging = true;
    progressWrap.classList.add('dragging');
    clearTimeout(hideTimer); // ما نخفي طبقة التحكم أثناء السحب
    progressWrap.setPointerCapture(e.pointerId);
    previewAt(fractionFromEvent(e));
  });
  progressWrap.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    e.stopPropagation();
    previewAt(fractionFromEvent(e));
  });
  const endDrag = (e) => {
    if(!dragging) return;
    dragging = false;
    progressWrap.classList.remove('dragging');
    const dur = lastKnownPlayerInfo.duration || 0;
    if(dur > 0){
      const frac = fractionFromEvent(e);
      seekToAbs(frac * dur);
    }
    showOverlay();
  };
  progressWrap.addEventListener('pointerup', (e) => { e.stopPropagation(); endDrag(e); });
  progressWrap.addEventListener('pointercancel', (e) => { e.stopPropagation(); dragging = false; progressWrap.classList.remove('dragging'); });
}

/* ============ زر مقترحات فوق الفيديو: يفتح/يغلق قائمة بأي وقت (مو بس بعد نهاية الفيديو) ============ */
/* بالضغط على وحدة من القائمة يشتغل فورًا للجميع بالروم. زر ✕ يسكّر القائمة بدون ما يغيّر شي. */
let manualSuggestState = { forVideoId: null, items: [], loading: false };
function buildSuggestButton(frame){
  const oldBtn = frame.querySelector('.voc-suggest-btn');

  frame.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'voc-suggest-panel';
  frame.appendChild(panel);

  const closePanel = () => panel.classList.remove('open');

  const renderPanelContent = () => {
    let body;
    if(manualSuggestState.loading){
      body = `<div class="vsp-status">جاري التحميل... ⏳</div>`;
    } else if(!manualSuggestState.items.length){
      body = `<div class="vsp-status">تعذّر جلب مقترحات الآن، جرّب مرة ثانية 🙁</div>`;
    } else {
      const cards = manualSuggestState.items.map(it => `
        <button class="vsp-card" data-vid="${escapeHtml(it.videoId)}" title="${escapeHtml(it.title || '')}">
          <img src="${it.thumb}" alt="" loading="lazy">
          <span>${escapeHtml((it.title || 'فيديو مقترح').slice(0, 46))}</span>
        </button>`).join('');
      body = `<div class="vsp-grid">${cards}</div>`;
    }
    panel.innerHTML = `<div class="vsp-head"><span>🎬 مقترحات</span><button class="vsp-close" id="vspClose">✕</button></div>${body}`;
    const closeBtn = panel.querySelector('#vspClose');
    if(closeBtn) closeBtn.onclick = (e) => { e.stopPropagation(); closePanel(); };
    panel.querySelectorAll('[data-vid]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const vid = el.getAttribute('data-vid');
        const item = manualSuggestState.items.find(i => i.videoId === vid);
        if(item){ playSuggestedVideo(item); closePanel(); }
      };
    });
  };

  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const willOpen = !panel.classList.contains('open');
    panel.classList.toggle('open', willOpen);
    if(!willOpen) return;
    // إذا عندنا مقترحات محمّلة مسبقًا لنفس الفيديو الحالي، نعرضها فورًا بدون إعادة جلب
    if(manualSuggestState.forVideoId === state.videoId && (manualSuggestState.items.length || manualSuggestState.loading)){
      renderPanelContent();
      return;
    }
    manualSuggestState = { forVideoId: state.videoId, items: [], loading: true };
    renderPanelContent();
    let title = (state.queue[state.queueIndex] && state.queue[state.queueIndex].title) || '';
    if(!title) title = await fetchVideoTitle(state.videoId);
    const items = await fetchRelatedVideosFor(title, state.videoId, 10);
    if(manualSuggestState.forVideoId !== state.videoId) return; // تغيّر الفيديو أثناء الجلب، نتجاهل النتيجة القديمة
    manualSuggestState = { forVideoId: state.videoId, items, loading: false };
    renderPanelContent();
  });
}

function mountMediaFrame(){
  const frame = document.getElementById('videoFrame');
  if(!frame) return;
  frame.classList.toggle('ratio-9x16', state.platform === 'tiktok');
  iframeEl = null;
  videoEl = null;
  syncCtl.key = null;
  if(state.platform === 'youtube' && state.videoId){
    const iframe = document.createElement('iframe');
    // controls=0 يخفي أزرار التحكم الأصلية بمشغّل يوتيوب (تشغيل/إيقاف/شريط التقدم) عن الجميع،
    // حتى ما يقدر أي عضو (غير القائد) يتحكم بالفيديو مباشرة من المشغّل نفسه ويكسر المزامنة.
    // القائد يتحكم فقط عبر أزرار مشمش (⏪ ⏯️ ⏩) اللي تمر عبر نظام المزامنة.
    iframe.src = `https://www.youtube-nocookie.com/embed/${state.videoId}?enablejsapi=1&autoplay=1&mute=1&playsinline=1&controls=0&disablekb=1&modestbranding=1&rel=0&fs=0&iv_load_policy=3&origin=${encodeURIComponent(window.location.origin)}`;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    // نمنع أي ضغط مباشر على مشغّل يوتيوب الأصلي (الشعار/العنوان/منطقة الفيديو نفسها) حتى ما يودّي
    // المستخدم بالغلط لتطبيق يوتيوب الحقيقي. كل التحكم يمر فقط عبر أزرارنا (video-overlay-controls)
    // اللي هي عناصر منفصلة فوق الإطار وما تتأثر بهالخاصية. التشغيل التلقائي غير متأثر لأنه مفوّض
    // عبر iframe.allow="autoplay" وما يحتاج ضغطة على الإطار نفسه.
    iframe.style.pointerEvents = 'none';
    frame.appendChild(iframe);
    iframeEl = iframe;
    lastKnownPlayerInfo.currentTime = null;
    lastKnownPlayerInfo.playerState = null;
    lastKnownPlayerInfo.duration = null;
    lastKnownPlayerInfo.loadedFraction = null;
    lastKnownPlayerInfo.muted = undefined;
    lastKnownPlayerInfo.rate = 1;
    lastKnownPlayerInfo.at = 0;
    ensureSyncOverlay(frame);
    const startYtListening = () => {
      if(!iframe.contentWindow) return;
      // لازم نرسل مصافحة "listening" أول شي، وإلا مشغّل يوتيوب ما يبدأ إرسال تحديثات
      // infoDelivery (الوقت الحالي/المدة/حالة التشغيل) إطلاقًا حتى لو سجّلنا addEventListener
      iframe.contentWindow.postMessage(JSON.stringify({event:'listening', id:'mishmish-player'}), '*');
      ytCommand(iframe, 'addEventListener', ['onStateChange']);
      ytCommand(iframe, 'addEventListener', ['onReady']);
      if(lastKnownPlayerInfo.currentTime == null) ytCommand(iframe, 'mute');
    };
    iframe.addEventListener('load', () => {
      startYtListening();
      // إعادة إرسال المصافحة بعد لحظة كضمان إضافي (بعض الأجهزة/المتصفحات تفوّت أول رسالة)
      setTimeout(startYtListening, 400);
      setTimeout(startYtListening, 1200);
    });
    if(isLeaderNow()){ buildVideoOverlayControls(frame); buildSuggestButton(frame); }
  } else if(state.platform === 'tiktok' && state.mediaId){
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.tiktok.com/embed/v2/${state.mediaId}`;
    iframe.allow = "autoplay; encrypted-media; fullscreen";
    iframe.allowFullscreen = true;
    iframe.style.background = '#000';
    frame.appendChild(iframe);
  } else if(state.platform === 'generic' && state.mediaId){
    const url = state.mediaId;
    const embed = detectGenericEmbed(url);
    if(embed.kind === 'file'){
      const video = document.createElement('video');
      video.src = embed.src;
      // نخفي أزرار التحكم الأصلية عن الجميع (زي يوتيوب بالضبط) — حتى ما يقدر أي عضو
      // (غير القائد) يتحكم بالفيديو مباشرة من المشغّل نفسه ويكسر المزامنة.
      // القائد يتحكم فقط عبر أزرار مشمش (⏪ ⏯️ ⏩) اللي تمر عبر نظام المزامنة.
      video.controls = false;
      video.autoplay = false; video.muted = true; video.preload = 'auto'; video.playsInline = true;
      video.disablePictureInPicture = true;
      video.style.width = '100%'; video.style.height = '100%'; video.style.background = '#000';
      // نفس منطق إطار يوتيوب: نمنع الضغط المباشر على الفيديو، التحكم فقط عبر أزرارنا فوقه
      video.style.pointerEvents = 'none';
      frame.appendChild(video);
      videoEl = video;
      lastKnownPlayerInfo.currentTime = null;
      lastKnownPlayerInfo.playerState = null;
      lastKnownPlayerInfo.duration = null;
      lastKnownPlayerInfo.loadedFraction = null;
      lastKnownPlayerInfo.muted = undefined;
      lastKnownPlayerInfo.at = 0;
      ensureSyncOverlay(frame);
      // نغذّي lastKnownPlayerInfo من أحداث الفيديو الحقيقية (نفس رموز حالة يوتيوب: 1=تشغيل 2=إيقاف 0=انتهى)
      video.addEventListener('timeupdate', () => { lastKnownPlayerInfo.currentTime = video.currentTime; });
      video.addEventListener('playing', () => { lastKnownPlayerInfo.playerState = 1; });
      video.addEventListener('pause', () => { lastKnownPlayerInfo.playerState = 2; });
      video.addEventListener('ended', () => { lastKnownPlayerInfo.playerState = 0; });
      video.addEventListener('loadedmetadata', () => {
        if(isFinite(video.duration) && video.duration > 0) lastKnownPlayerInfo.duration = video.duration;
      });
      video.addEventListener('error', () => {
        if(isLeaderNow()) setStatus(embed.isDrive
          ? 'تعذّر تشغيل ملف درايف مباشرة — تأكد أن مشاركة الملف "لأي شخص لديه الرابط"، وأن حجمه ليس كبيرًا جدًا (درايف يمنع البث المباشر للملفات الضخمة). جرّب رابط تحميل مباشر من مكان آخر.'
          : 'تعذّر تشغيل رابط الفيديو المباشر.', true);
      });
      if(isLeaderNow()) buildVideoOverlayControls(frame);
      if(embed.isDrive){
        const note = document.createElement('div');
        note.className = 'generic-fallback-link';
        note.textContent = '🔗 فيديو من درايف — إذا ما اشتغل، تأكد إن مشاركته "لأي شخص لديه الرابط" (قد لا يعمل مع الملفات الكبيرة جدًا)';
        frame.insertAdjacentElement('afterend', note);
      }
    } else {
      const iframe = document.createElement('iframe');
      iframe.src = embed.src;
      iframe.allow = "autoplay; fullscreen; picture-in-picture";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      frame.appendChild(iframe);
      const fallback = document.createElement('a');
      fallback.href = url; fallback.target = '_blank'; fallback.rel = 'noopener';
      fallback.className = 'generic-fallback-link';
      fallback.textContent = '🔗 إذا لم يظهر الفيديو هنا (بعض المواقع تمنع ذلك)، افتحه في نافذة جديدة';
      frame.insertAdjacentElement('afterend', fallback);
    }
  }
}

let whoPanelOpen = false;
function renderTopbarOnly(){
  const who = document.getElementById('whoRow');
  if(!who) return;
  const names = Object.keys(state.users);
  const iAmLeader = isLeaderNow();
  const chipsHtml = names.map(n => {
    const isLeaderChip = state.roomCreatedBy && n === state.roomCreatedBy;
    const crownHtml = crownBadgeFor(n);
    const canTransfer = iAmLeader && n !== state.myName;
    return `<div class="chip ${n===state.myName?'me':''} ${isLeaderChip?'leader':''}">
      <span class="dot"></span>${crownHtml}${escapeHtml(n)}
      ${canTransfer ? `<span class="transfer-link" data-transfer="${escapeHtml(n)}" title="نقل قيادة الغرفة لهذا الشخص">${ICON_TRANSFER}</span>` : ''}
    </div>`;
  }).join('');
  who.innerHTML = `
    <button class="who-toggle" id="whoToggleBtn" title="الأعضاء المتصلون">👥 <span>${names.length}</span></button>
    <div class="who-panel ${whoPanelOpen ? 'open' : ''}" id="whoPanel">${chipsHtml || '<div class="status-line">لا أحد بعد</div>'}</div>
  `;
  const toggleBtn = document.getElementById('whoToggleBtn');
  if(toggleBtn){
    toggleBtn.onclick = (e) => {
      e.stopPropagation();
      whoPanelOpen = !whoPanelOpen;
      const panel = document.getElementById('whoPanel');
      if(panel) panel.classList.toggle('open', whoPanelOpen);
    };
  }
  who.querySelectorAll('[data-transfer]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); transferLeadership(el.getAttribute('data-transfer')); };
  });
}

/* ============ نقل قيادة الغرفة لعضو آخر ============ */
async function transferLeadership(newName){
  if(!isLeaderNow() || !newName || newName === state.myName) return;
  const ok = window.confirm(`تحويل قيادة الغرفة إلى "${newName}"؟ سيصبح هو من يتحكم بالفيديو بعد ذلك`);
  if(!ok) return;
  try{
    const cur = await getRoomState(state.roomCode) || {};
    const next = {...cur, createdBy: newName};
    await setRoomState(state.roomCode, next);
    state.roomCreatedBy = newName;
    try{
      await pushChatMessage(state.roomCode, {sys:true, id:genMsgId(), text: state.myName + ' نقل قيادة الغرفة إلى ' + newName + ' 👑', ts:Date.now()});
    }catch(e){}
    render();
  }catch(e){
    setStatus('تعذر نقل القيادة، حاول مرة أخرى');
  }
}
document.addEventListener('click', (e) => {
  if(!whoPanelOpen) return;
  const who = document.getElementById('whoRow');
  if(who && !who.contains(e.target)){
    whoPanelOpen = false;
    const panel = document.getElementById('whoPanel');
    if(panel) panel.classList.remove('open');
  }
});

function renderChatOnly(){
  const log = document.getElementById('chatLog');
  if(!log) return;
  if(!state.chat.length){
    log.innerHTML = `<div class="empty-state">لا توجد رسائل بعد، ابدأ الدردشة 👋</div>`;
    return;
  }
  const composerFocused = document.activeElement && document.activeElement.id === 'chatInput';
  const wasNearBottom = composerFocused || (log.scrollHeight - log.scrollTop - log.clientHeight) < 60;
  let preservedEditValue = null;
  if(editingId){
    const existingInp = document.getElementById('editInput-' + editingId);
    if(existingInp) preservedEditValue = existingInp.value;
  }

  log.innerHTML = state.chat.map(m => {
    if(m.sys){
      return `<div class="msg system"><div class="bubble">${escapeHtml(m.text)}</div></div>`;
    }
    const mine = m.name === state.myName;
    const isEditingThis = editingId === m.id;
    const canEdit = mine && m.type === 'text' && !isEditingThis && (Date.now() - m.ts < EDIT_WINDOW_MS);

    let bodyHtml;
    if(isEditingThis){
      bodyHtml = `<div class="edit-box">
        <input id="editInput-${m.id}" type="text">
      </div>`;
    } else if(m.type === 'image'){
      bodyHtml = `<img class="chat-image" src="${m.dataUrl}" onclick="window.open(this.src)" alt="صورة">`;
    } else if(m.type === 'audio'){
      bodyHtml = `<audio class="chat-audio" controls src="${m.dataUrl}"></audio>`;
    } else {
      bodyHtml = escapeHtml(m.text) + (m.edited ? `<span class="edited-tag">(معدّلة)</span>` : '');
    }

    let replyQuoteHtml = '';
    if(m.replyTo && m.replyTo.id){
      replyQuoteHtml = `<div class="reply-quote" data-goto="${m.replyTo.id}">
        <div class="reply-quote-name">${escapeHtml(m.replyTo.name)}</div>
        <div class="reply-quote-text">${escapeHtml(m.replyTo.preview || '')}</div>
      </div>`;
    }

    let actionsHtml = '';
    if(isEditingThis){
      actionsHtml = `<div class="msg-actions">
        <span class="edit-link" data-save="${m.id}">حفظ</span>
        <span class="edit-link" data-cancel="${m.id}">إلغاء</span>
      </div>`;
    } else {
      const bits = [];
      bits.push(`<span class="edit-link" data-reply="${m.id}">رد</span>`);
      if(canEdit) bits.push(`<span class="edit-link" data-edit="${m.id}">تعديل</span>`);
      actionsHtml = `<div class="msg-actions">${bits.join('')}</div>`;
    }

    const genderClass = m.gender === 'boy' ? 'gender-boy' : (m.gender === 'girl' ? 'gender-girl' : '');
    return `
      <div class="msg ${mine?'mine':''} ${genderClass}" data-id="${m.id}">
        <div class="who">${crownBadgeFor(m.name)}${escapeHtml(m.name)} · ${fmtTime(m.ts)}</div>
        <div class="bubble">${replyQuoteHtml}${bodyHtml}</div>
        ${actionsHtml}
      </div>`;
  }).join('');

  if(wasNearBottom) log.scrollTop = log.scrollHeight;

  log.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => startEdit(el.getAttribute('data-edit')));
  log.querySelectorAll('[data-save]').forEach(el => el.onclick = () => saveEdit(el.getAttribute('data-save')));
  log.querySelectorAll('[data-cancel]').forEach(el => el.onclick = cancelEdit);
  log.querySelectorAll('[data-reply]').forEach(el => el.onclick = () => startReply(el.getAttribute('data-reply')));
  log.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => scrollToMsg(el.getAttribute('data-goto')));

  if(editingId){
    const inp = document.getElementById('editInput-' + editingId);
    const msg = state.chat.find(m => m.id === editingId);
    if(inp && msg){
      inp.value = preservedEditValue !== null ? preservedEditValue : msg.text;
      inp.focus();
      inp.select();
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter') saveEdit(editingId);
        if(e.key === 'Escape') cancelEdit();
      });
    }
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ============ init ============ */
(async function init(){
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){ /* بيئات ما تدعم service worker (مثل فتح الملف مباشرة) */ }
  }
  await loadMyName();
  render();
  if(pendingRoomCode){
    const existing = await getRoomState(pendingRoomCode);
    if(!existing){
      state.errorMsg = 'رابط الدعوة غير صالح — لا توجد غرفة بهذا الكود';
      render();
    } else if(isRoomExpired(existing)){
      state.errorMsg = 'انتهت صلاحية رابط الدعوة هذا (مضى عليه أكثر من 24 ساعة)';
      render();
    }
  } else if(pendingSharedUrl){
    // فُتح التطبيق عن طريق مشاركة فيديو من تطبيق ثاني (زر Share) — إذا عندنا غرفة سابقة نرجّع ندخلها تلقائيًا ونشغّل الفيديو فورًا
    const saved = getSavedRoom();
    if(saved && saved.code && saved.name){
      try{
        const existing = await getRoomState(saved.code);
        if(existing && !isRoomExpired(existing)){
          state.myName = saved.name;
          state.roomCode = saved.code;
          state.roomCreatedBy = existing.createdBy || null;
          enterRoom();
        }
      }catch(e){}
    }
  }
})();
</script>
